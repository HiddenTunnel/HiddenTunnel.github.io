<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Crew - Underground Chat</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --green: #5CFF72;
            --orange: #FF7A00;
            --bg: #050505;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding-bottom: 90px;
            background-color: #080808;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Thinner Top Navigation Header */
        header {
            width: 100%;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.88);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        nav {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.25rem;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .logo:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .logo span {
            color: var(--green);
        }

        /* Desktop Navigation Links */
        .desktop-nav {
            display: flex;
            gap: 16px;
            list-style: none;
        }

        .desktop-nav li a {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .desktop-nav li a:hover,
        .desktop-nav li a.active {
            color: var(--green);
            background: rgba(92, 255, 114, 0.08);
            transform: translateY(-2px);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            z-index: 100;
            justify-content: space-around;
            align-items: center;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 0.7rem;
            font-weight: 500;
            gap: 4px;
            transition: color 0.3s ease;
        }

        .bottom-nav-item svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }

        .bottom-nav-item:hover,
        .bottom-nav-item.active {
            color: var(--green);
        }

        .bottom-nav-item.active svg path,
        .bottom-nav-item.active svg circle {
            stroke: var(--green);
        }

        .graffiti-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; opacity: 0.05;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 800 800"><text x="50" y="450" fill="%235CFF72" font-family="sans-serif" font-weight="900" font-size="90" transform="rotate(-15 50,450)">UNDERGROUND</text></svg>');
            background-repeat: repeat;
            background-size: 350px 350px;
        }

        .search-container {
            max-width: 600px;
            margin: 85px auto 20px auto;
            padding: 16px;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(92, 255, 114, 0.15);
            border-radius: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .search-header {
            margin-bottom: 16px;
            text-align: center;
        }

        .search-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 1.15rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-header h2 span {
            color: var(--green, #5CFF72);
            font-weight: 600;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            background: #141414;
            border: 1.5px solid rgba(92, 255, 114, 0.3);
            border-radius: 30px;
            padding: 12px 20px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--green, #5CFF72);
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(92, 255, 114, 0.3);
        }

        .search-btn {
            background: var(--green, #5CFF72);
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 0 22px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .search-btn:hover {
            transform: scale(1.03);
        }

        /* Section Header and Title Styles */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: 600;
            margin: 0;
        }

        .create-group-text {
            color: #7a7a7a;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            transition: .25s ease;
            user-select: none;
        }

        .create-group-text:hover,
        .create-group-text:active {
            color: #5CFF72;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ------------------------------------------------------------------ */
        /* FIX: Overflow issues for long URLs or text in Chat Cards           */
        /* ------------------------------------------------------------------ */
        .chat-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #151515;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; /* Ensures child elements don't spill outside */
        }

        .chat-card:hover {
            border-color: rgba(92, 255, 114, 0.3);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0; /* Critical for Flexbox text-truncation */
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(92, 255, 114, 0.4);
            background: #222;
            flex-shrink: 0; /* Prevents avatar from shrinking */
        }

        .user-details {
            flex: 1;
            min-width: 0; /* Critical for Flexbox text-truncation */
        }

        .user-details h4 {
            color: #eee;
            font-size: 0.95rem;
            font-weight: 400;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-details .last-msg {
            font-size: 0.83rem;
            color: #888;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Unread Styles */
        .user-details h4.unread {
            font-weight: 700;
            color: #fff;
        }

        .user-details .last-msg.unread {
            font-weight: 700;
            color: #fff;
        }
        /* ------------------------------------------------------------------ */

        @media (max-width: 768px) {
            header {
                padding: 8px 12px;
            }
            .logo {
                font-size: 1.15rem;
            }
            .desktop-nav {
                display: none;
            }
            .bottom-nav {
                display: flex;
            }
            .search-container {
                margin-top: 10px;
                margin-bottom: 80px;
            }
        }

        /* Selection Bar Styles */
        #selectionBar {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            gap: 10px;
            background: rgba(20, 20, 20, 0.95);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(92, 255, 114, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        #createSelectedGroup {
            background: #5CFF72;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 800;
            cursor: pointer;
        }

        #cancelSelection {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="graffiti-bg"></div>

    <!-- Thin Top Navigation Header -->
    <header>
        <nav>
            <a href="index.html" class="logo">
                UNDERGROUND <span>CHAT</span>
            </a>
            
            <ul class="desktop-nav">
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="chat.html">💬 Chats</a></li>
                <li><a href="friends.html" class="active">👥 Friends</a></li>
                <li><a href="notification.html">🔔 Notifications</a></li>
                <li><a href="settings.html">⚙ Settings</a></li>
            </ul>
        </nav>
    </header>

    <div class="search-container">
        <div class="search-header">
            <h2>Underground <span>Messages</span></h2>
        </div>

        <!-- Floating Selection Bar -->
        <div id="selectionBar" style="display:none;">
            <button id="createSelectedGroup">
                Create Group
            </button>
            <button id="cancelSelection">
                Cancel
            </button>
        </div>

        <!-- 🔍 Search Box -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Type Name or 8-digit ID..." autocomplete="off">
            <button id="searchBtn" class="search-btn">SEARCH</button>
        </div>

        <div class="section-header">
            <div class="section-title" id="listTitle">
                Chats & Groups
            </div>

            <span id="createGroupBtn" class="create-group-text">
                Create Group
            </span>
        </div>

        <div class="user-list" id="userList">
            <!-- Dynamic Users/Chats -->
        </div>
    </div>

    <!-- Bottom Navigation Bar for Mobile -->
<div id="bottom-nav-container"></div>

<script>
    fetch("bottom-nav.html")
        .then(r => r.text())
        .then(html => {
            document.getElementById("bottom-nav-container").innerHTML = html;
        });
</script>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Selection State
        let selectedUsers = new Set();
        let selectionMode = false;

        // Unsubscribe Listeners Tracking
        let unsubscribeChats;
        let unsubscribeGroups;

        // Displayed Cards Tracker for Group & User Uniqueness Check
        let displayedCards = new Set();

        // Default Avatar Fallback
        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        let currentUserId = localStorage.getItem("ug_current_user_id");
        let searchTimeout = null;

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const userList = document.getElementById('userList');
        const listTitle = document.getElementById('listTitle');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                localStorage.setItem("ug_current_user_id", user.uid);
                loadRecentChats();
            } else {
                window.location.href = "login.html";
            }
        });

        // 1. Load Recent Chats & Groups
        function loadRecentChats() {
            // Clean up previous listeners
            if (unsubscribeChats) unsubscribeChats();
            if (unsubscribeGroups) unsubscribeGroups();

            displayedCards.clear();

            listTitle.textContent = "Chats & Groups";
            userList.innerHTML = `<p style="color:#666;text-align:center;padding:15px">Loading chats...</p>`;

            let loadedChatIds = new Set();

            // PRIVATE CHAT LOAD
            const chatsRef = collection(db, "chats");
            const q = query(chatsRef, where("members", "array-contains", currentUserId));

            unsubscribeChats = onSnapshot(q, (snapshot) => {
                userList.innerHTML = "";
                loadedChatIds.clear();

                snapshot.forEach((chatDoc) => {
                    if (loadedChatIds.has(chatDoc.id)) return;
                    loadedChatIds.add(chatDoc.id);

                    const data = chatDoc.data();
                    const peerUid = data.members.find(id => id !== currentUserId);

                    if (!peerUid) return;

                    getDoc(doc(db, "users", peerUid)).then(userSnap => {
                        const userData = userSnap.exists() ? userSnap.data() : {};

                        addChatCard({
                            id: peerUid,
                            chatId: chatDoc.id,
                            name: userData.fullName || "User",
                            photo: userData.photo || defaultAvatar,
                            last: data.lastMessage || "Message",
                            unread: data.unreadBy === currentUserId || false
                        }, false);
                    });
                });
            });

            // GROUP CHAT LOAD
            const groupsRef = collection(db, "groups");
            const groupQuery = query(groupsRef, where("members", "array-contains", currentUserId));

            unsubscribeGroups = onSnapshot(groupQuery, (snapshot) => {
                snapshot.forEach(groupDoc => {
                    const group = groupDoc.data();

                    addChatCard({
                        id: groupDoc.id,
                        name: "👥 " + group.groupName,
                        photo: group.groupPhoto || defaultAvatar,
                        last: group.lastMessage || "Group created",
                        unread: (group.unreadBy && group.unreadBy.includes(currentUserId)) || false
                    }, true);
                });
            });
        }

        // Add Chat Card Function
        function addChatCard(data, isGroup) {
            let uniqueKey = isGroup ? "group_" + data.id : "user_" + data.id;

            if (displayedCards.has(uniqueKey)) {
                return;
            }

            displayedCards.add(uniqueKey);

            const card = document.createElement("div");
            card.className = "chat-card";

            card.innerHTML = `
                <div class="user-info">
                    <img class="user-avatar" src="${data.photo}">
                    <div class="user-details">
                        <h4 class="${data.unread ? 'unread' : ''}">
                            ${data.name}
                        </h4>
                        <p class="last-msg ${data.unread ? 'unread' : ''}">
                            ${data.last}
                        </p>
                    </div>
                </div>
            `;

            let pressTimer;

            // Long Press Handlers
            card.addEventListener("mousedown", startPress);
            card.addEventListener("mouseup", cancelPress);
            card.addEventListener("mouseleave", cancelPress);

            card.addEventListener("touchstart", startPress);
            card.addEventListener("touchend", cancelPress);

            function startPress() {
                pressTimer = setTimeout(() => {
                    if (!isGroup) {
                        selectionMode = true;
                        toggleSelect(card, data.id);
                    }
                }, 600);
            }

            function cancelPress() {
                clearTimeout(pressTimer);
            }

            // Click Handler with Selection Mode Fix
            card.addEventListener("click", () => {
                if (selectionMode && !isGroup) {
                    toggleSelect(card, data.id);
                    return;
                }

                if (isGroup) {
                    location.href = "group.html?groupId=" + data.id;
                } else {
                    const chatId = data.chatId || (currentUserId < data.id ? `${currentUserId}_${data.id}` : `${data.id}_${currentUserId}`);
                    location.href = `chat.html?chatId=${chatId}&peerUid=${data.id}`;
                }
            });

            userList.appendChild(card);
        }

        // Toggle Selection Handler
        function toggleSelect(card, id) {
            if (selectedUsers.has(id)) {
                selectedUsers.delete(id);
                card.style.border = "";
            } else {
                selectedUsers.add(id);
                card.style.border = "2px solid #5CFF72";
            }

            if (selectedUsers.size === 0) {
                selectionMode = false;
                document.getElementById("selectionBar").style.display = "none";
            } else {
                document.getElementById("selectionBar").style.display = "flex";
            }
        }

        // Cancel Selection Listener
        document.getElementById("cancelSelection").onclick = () => {
            selectedUsers.clear();
            selectionMode = false;
            document.querySelectorAll(".chat-card").forEach(c => {
                c.style.border = "";
            });
            document.getElementById("selectionBar").style.display = "none";
        };

        // Create Selected Group Listener
        document.getElementById("createSelectedGroup").addEventListener("click", () => {
            if (selectedUsers.size < 1) {
                alert("Select members first");
                return;
            }

            localStorage.setItem(
                "selectedGroupMembers",
                JSON.stringify(Array.from(selectedUsers))
            );

            window.location.href = "create-group.html";
        });

        // Search Handlers
        async function performSearch() {
            displayedCards.clear();

            const queryText = searchInput.value.trim().toLowerCase();

            if (!queryText) {
                loadRecentChats();
                return;
            }

            listTitle.textContent = "Search Results";
            userList.innerHTML = `<p style="color:#666; text-align:center; padding: 15px;">Searching users...</p>`;

            try {
                const usersRef = collection(db, "users");
                const snapshot = await getDocs(usersRef);
                userList.innerHTML = "";

                let foundCount = 0;
                const addedUids = new Set();

                snapshot.forEach((docSnap) => {
                    const userData = docSnap.data();
                    const targetUid = docSnap.id;

                    if (targetUid === currentUserId || addedUids.has(targetUid)) return;

                    const name = (userData.fullName || userData.name || userData.displayName || "").toLowerCase();
                    const versityId = (userData.versityId || "").toString().toLowerCase();

                    if (name.includes(queryText) || versityId.includes(queryText)) {
                        foundCount++;
                        addedUids.add(targetUid);
                        
                        addChatCard({
                            id: targetUid,
                            name: userData.fullName || "Anonymous",
                            photo: userData.photo || defaultAvatar,
                            last: `ID: ${userData.versityId || 'N/A'}`,
                            unread: false
                        }, false);
                    }
                });

                if (foundCount === 0) {
                    userList.innerHTML = `<p style="color:#888; text-align:center; padding: 15px;">No users found for "${queryText}".</p>`;
                }
            } catch (err) {
                console.error("Search error:", err);
                userList.innerHTML = `<p style="color:#ff4d4d; text-align:center; padding: 15px;">Search error. Check console.</p>`;
            }
        }

        searchBtn.addEventListener('click', performSearch);

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 300);
        });

        document.getElementById("createGroupBtn").addEventListener("click", () => {
            window.location.href = "create-group.html";
        });
    </script>

    <script src="navbar.js"></script>
</body>
</html>
