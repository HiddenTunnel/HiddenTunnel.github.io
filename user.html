<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Crew - Underground Chat</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --green: #5CFF72;
            --orange: #FF7A00;
            --bg: #050505;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding-bottom: 90px;
            background-color: #080808;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(255, 77, 77, 0.2); }
            50% { box-shadow: 0 0 15px rgba(255, 77, 77, 0.5); }
            100% { box-shadow: 0 0 5px rgba(255, 77, 77, 0.2); }
        }

        /* Thinner Top Navigation Header */
        header {
            width: 100%;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.88);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        nav {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.25rem;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .logo:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .logo span {
            color: var(--green);
        }

        /* Desktop Navigation Links */
        .desktop-nav {
            display: flex;
            gap: 16px;
            list-style: none;
        }

        .desktop-nav li a {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .desktop-nav li a:hover,
        .desktop-nav li a.active {
            color: var(--green);
            background: rgba(92, 255, 114, 0.08);
            transform: translateY(-2px);
        }

        .nav-btn-group {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        /* Animated Thin Top Logout Button */
        .btn-logout {
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.35);
            color: #ff4d4d;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn-logout img {
            width: 15px;
            height: 15px;
            transition: transform 0.3s ease;
        }

        .btn-logout:hover {
            background: rgba(255, 77, 77, 0.2);
            border-color: #ff4d4d;
            transform: translateY(-1px);
            animation: pulseGlow 1.5s infinite;
        }

        .btn-logout:hover img {
            transform: translateX(3px);
        }

        .graffiti-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; opacity: 0.05;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 800 800"><text x="50" y="450" fill="%235CFF72" font-family="sans-serif" font-weight="900" font-size="90" transform="rotate(-15 50,450)">UNDERGROUND</text></svg>');
            background-repeat: repeat;
            background-size: 350px 350px;
        }

        .search-container {
            max-width: 600px;
            margin: 85px auto 20px auto;
            padding: 16px;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(92, 255, 114, 0.15);
            border-radius: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .search-header {
            margin-bottom: 16px;
            text-align: center;
        }

        .search-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 1.15rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-header h2 span {
            color: var(--green, #5CFF72);
            font-weight: 600;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            background: #141414;
            border: 1.5px solid rgba(92, 255, 114, 0.3);
            border-radius: 30px;
            padding: 12px 20px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--green, #5CFF72);
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(92, 255, 114, 0.3);
        }

        .search-btn {
            background: var(--green, #5CFF72);
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 0 22px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .search-btn:hover {
            transform: scale(1.03);
        }

        .section-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #151515;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-card:hover {
            border-color: rgba(92, 255, 114, 0.3);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(92, 255, 114, 0.4);
            background: #222;
        }

        .user-details h4 {
            color: #eee;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
        }

        .user-details .last-msg {
            font-size: 0.83rem;
            color: #888;
            margin: 0;
        }

        .start-chat-btn {
            background: transparent;
            border: 1px solid var(--green, #5CFF72);
            color: var(--green, #5CFF72);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .start-chat-btn:hover {
            background: var(--green, #5CFF72);
            color: #000;
        }

        @media (max-width: 768px) {
            header {
                padding: 8px 12px;
            }
            .logo {
                font-size: 1.15rem;
            }
            .desktop-nav {
                display: none;
            }
            .search-container {
                margin-top: 75px;
            }
        }
    </style>
</head>
<body>
    <div class="graffiti-bg"></div>

    <!-- Thin Top Navigation Header -->
    <header>
        <nav>
            <a href="index.html" class="logo">
                UNDERGROUND <span>CHAT</span>
            </a>
            
            <ul class="desktop-nav">
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="chat.html">💬 Chats</a></li>
                <li><a href="friends.html" class="active">👥 Friends</a></li>
                <li><a href="notification.html">🔔 Notifications</a></li>
                <li><a href="settings.html">⚙ Settings</a></li>
            </ul>

            <div class="nav-btn-group">
                <button id="logoutBtn" class="btn-logout" title="Logout">
                    <img src="assets/svg/logout.svg" alt="Logout">
                    <span>Logout</span>
                </button>
            </div>
        </nav>
    </header>

    <div class="search-container">
        <div class="search-header">
            <h2>Underground <span>Messages</span></h2>
        </div>

        <!-- 🔍 Search Box -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Type Name or 8-digit ID..." autocomplete="off">
            <button id="searchBtn" class="search-btn">SEARCH</button>
        </div>

        <div class="section-title" id="listTitle">Recent Conversations</div>

        <div class="user-list" id="userList">
            <!-- Dynamic Users/Chats -->
        </div>
    </div>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Default Avatar Fallback
        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        let currentUserId = localStorage.getItem("ug_current_user_id");
        let searchTimeout = null;

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const userList = document.getElementById('userList');
        const listTitle = document.getElementById('listTitle');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                localStorage.setItem("ug_current_user_id", user.uid);
                loadRecentChats();
            } else {
                window.location.href = "login.html";
            }
        });

        // Top Navigation Logout Handler
        document.getElementById("logoutBtn").addEventListener("click", async () => {
            try {
                await signOut(auth);
                localStorage.removeItem("ug_current_user_id");
                window.location.href = "login.html";
            } catch (err) {
                console.error("Logout failed:", err);
            }
        });

        // 1. Load Recent Messenger List
        function loadRecentChats() {
            listTitle.textContent = "Recent Conversations";
            userList.innerHTML = `<p style="color:#666; text-align:center; padding: 15px;">Loading...</p>`;

            const chatsRef = collection(db, "chats");
            const q = query(chatsRef, where("members", "array-contains", currentUserId));

            onSnapshot(q, async (snapshot) => {
                if (snapshot.empty) {
                    userList.innerHTML = `<p style="color:#666; text-align:center; padding: 15px;">No chats. Search users above!</p>`;
                    return;
                }

                userList.innerHTML = "";
                for (let chatDoc of snapshot.docs) {
                    const data = chatDoc.data();
                    const peerUid = data.members.find(id => id !== currentUserId);

                    if (peerUid) {
                        const userDoc = await getDoc(doc(db, "users", peerUid));
                        const peerData = userDoc.exists() ? userDoc.data() : {};

                        const displayName = peerData.fullName || peerData.name || peerData.displayName || peerData.username || `User (${peerUid.slice(0, 5)})`;
                        const avatarUrl = peerData.photo || peerData.photoURL || peerData.avatar || defaultAvatar;

                        const card = document.createElement('div');
                        card.className = 'chat-card';
                        card.innerHTML = `
                            <div class="user-info">
                                <img class="user-avatar" src="${avatarUrl}" alt="User">
                                <div class="user-details">
                                    <h4>${displayName}</h4>
                                    <p class="last-msg">${data.lastMessage || 'Message now'}</p>
                                </div>
                            </div>
                        `;
                        card.addEventListener('click', () => {
                            window.location.href = `chat.html?chatId=${chatDoc.id}&peerUid=${peerUid}`;
                        });
                        userList.appendChild(card);
                    }
                }
            });
        }

        // 2. Realtime Search Logic (With Debounce & Duplicate Prevention)
        async function performSearch() {
            const queryText = searchInput.value.trim().toLowerCase();

            if (!queryText) {
                loadRecentChats();
                return;
            }

            listTitle.textContent = "Search Results";
            userList.innerHTML = `<p style="color:#666; text-align:center; padding: 15px;">Searching users...</p>`;

            try {
                const usersRef = collection(db, "users");
                const snapshot = await getDocs(usersRef);
                userList.innerHTML = "";

                let foundCount = 0;
                const addedUids = new Set();

                snapshot.forEach((docSnap) => {
                    const userData = docSnap.data();
                    const targetUid = docSnap.id;

                    if (targetUid === currentUserId || addedUids.has(targetUid)) return;

                    const name = (userData.fullName || userData.name || userData.displayName || "").toLowerCase();
                    const versityId = (userData.versityId || "").toString().toLowerCase();

                    if (name.includes(queryText) || versityId.includes(queryText)) {
                        foundCount++;
                        addedUids.add(targetUid);
                        renderUserSearchResult(targetUid, userData);
                    }
                });

                if (foundCount === 0) {
                    userList.innerHTML = `<p style="color:#888; text-align:center; padding: 15px;">No users found for "${queryText}".</p>`;
                }
            } catch (err) {
                console.error("Search error:", err);
                userList.innerHTML = `<p style="color:#ff4d4d; text-align:center; padding: 15px;">Search error. Check console.</p>`;
            }
        }

        function renderUserSearchResult(targetUid, userData) {
            const displayName = userData.fullName || userData.name || userData.displayName || userData.username || 'Anonymous';
            const avatarUrl = userData.photo || userData.photoURL || userData.avatar || defaultAvatar;

            const card = document.createElement('div');
            card.className = 'chat-card';
            card.innerHTML = `
                <div class="user-info">
                    <img class="user-avatar" src="${avatarUrl}" alt="User">
                    <div class="user-details">
                        <h4>${displayName}</h4>
                        <p class="last-msg">ID: ${userData.versityId || 'N/A'}</p>
                    </div>
                </div>
                <button class="start-chat-btn">MESSAGE</button>
            `;

            card.addEventListener('click', () => startChat(targetUid));
            userList.appendChild(card);
        }

        async function startChat(targetUid) {
            const chatId = currentUserId < targetUid ? `${currentUserId}_${targetUid}` : `${targetUid}_${currentUserId}`;
            const chatRef = doc(db, "chats", chatId);
            const chatSnap = await getDoc(chatRef);

            if (!chatSnap.exists()) {
                await setDoc(chatRef, {
                    chatId: chatId,
                    members: [currentUserId, targetUid],
                    lastMessage: "",
                    lastSenderId: "",
                    isRead: true,
                    updatedAt: serverTimestamp()
                });
            }
            window.location.href = `chat.html?chatId=${chatId}&peerUid=${targetUid}`;
        }

        searchBtn.addEventListener('click', performSearch);

        // Smooth search input debouncing
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 300);
        });
    </script>

    <script src="navbar.js"></script>
</body>
</html>
