<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Crew - Underground Chat</title>
    <meta name="theme-color" content="#050505">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <!-- Main External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mobile Top Header Bar -->
    <div class="mobile-top-bar">
        <a href="profile.html" class="mobile-profile-btn" id="mobileProfileLink">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" alt="Profile" id="mobileProfileImg">
        </a>
        <button id="mobileLogoutBtn" class="mobile-logout-btn" title="Logout">
            <img src="assets/svg/logout.svg" alt="Logout" style="width: 20px; height: 20px;">
        </button>
    </div>

    <!-- Navigation Header (Desktop) -->
    <header>
        <nav>
            <a href="index.html" class="logo">
                UNDERGROUND <span>CHAT</span>
            </a>
            
            <ul class="desktop-nav">
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="chat.html">💬 Direct Tunnel</a></li>
                <li><a href="user.html" class="active">👥 Friends & Signals</a></li>
                <li><a href="notification.html">🔔 Notifications</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Container -->
    <div class="search-container">
        <div class="search-header">
            <h2>Underground <span>Messages</span></h2>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Type Name or Student ID..." autocomplete="off">
            <button id="searchBtn" class="search-btn">SEARCH</button>
        </div>

        <div class="section-title" id="listTitle">Recent Conversations</div>
        <div class="user-list" id="userList"></div>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
        <a href="index.html">
            <img src="assets/svg/home.svg" class="nav-icon" alt="Home">
            <span>Home</span>
        </a>
        <a href="chat.html">
            <img src="assets/svg/chat.svg" class="nav-icon" alt="Chat">
            <span>Tunnel</span>
        </a>
        <a href="user.html" class="active">
            <img src="assets/svg/users.svg" class="nav-icon" alt="Friends">
            <span>Friends</span>
        </a>
        <a href="notification.html">
            <img src="assets/svg/bell.svg" class="nav-icon" alt="Notifications">
            <span>Alerts</span>
        </a>
    </nav>

    <!-- Firebase Realtime & Search Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        let currentUserId = localStorage.getItem("ug_current_user_id");
        let searchTimeout = null;

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const userList = document.getElementById('userList');
        const listTitle = document.getElementById('listTitle');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                localStorage.setItem("ug_current_user_id", user.uid);
                
                // Set user avatar in top mobile bar if exists
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        if (userData.photo || userData.avatar) {
                            document.getElementById("mobileProfileImg").src = userData.photo || userData.avatar;
                        }
                    }
                } catch(e) { console.error(e); }

                loadRecentChats();
            } else {
                window.location.href = "login.html";
            }
        });

        const mobileLogoutBtn = document.getElementById("mobileLogoutBtn");
        if (mobileLogoutBtn) {
            mobileLogoutBtn.addEventListener("click", async () => {
                await signOut(auth);
                localStorage.removeItem("ug_current_user_id");
                window.location.href = "login.html";
            });
        }

        function loadRecentChats() {
            listTitle.textContent = "Recent Conversations";
            userList.innerHTML = `<p style="color:#666; text-align:center; padding: 15px;">Scanning signals...</p>`;

            const q = query(collection(db, "chats"), where("members", "array-contains", currentUserId));

            onSnapshot(q, async (snapshot) => {
                if (snapshot.empty) {
                    userList.innerHTML = `<p style="color:#666; text-align:center; padding: 15px;">No active chats. Search for crew members above!</p>`;
                    return;
                }

                userList.innerHTML = "";
                for (let chatDoc of snapshot.docs) {
                    const data = chatDoc.data();
                    const peerUid = data.members.find(id => id !== currentUserId);

                    if (peerUid) {
                        const userDoc = await getDoc(doc(db, "users", peerUid));
                        const peerData = userDoc.exists() ? userDoc.data() : {};

                        const displayName = peerData.fullName || peerData.name || peerData.displayName || `Member (${peerUid.slice(0, 5)})`;
                        const avatarUrl = peerData.photo || peerData.avatar || defaultAvatar;
                        const isUnread = data.lastSenderId !== currentUserId && data.isRead === false;

                        const card = document.createElement('div');
                        card.className = 'chat-card';
                        card.innerHTML = `
                            <div class="user-info">
                                <img class="user-avatar" src="${avatarUrl}" alt="Avatar">
                                <div class="user-details">
                                    <h4>${displayName}</h4>
                                    <p class="last-msg">${data.lastMessage || 'Connected. Tap to message.'}</p>
                                </div>
                            </div>
                            <a href="profile.html?uid=${peerUid}" class="btn-profile-link" onclick="event.stopPropagation()">ID Card</a>
                            ${isUnread ? `<div class="unread-badge"></div>` : ''}
                        `;

                        card.addEventListener('click', () => {
                            window.location.href = `chat.html?chatId=${chatDoc.id}&peerUid=${peerUid}`;
                        });
                        userList.appendChild(card);
                    }
                }
            });
        }

        async function performSearch() {
            const queryText = searchInput.value.trim().toLowerCase();
            if (!queryText) {
                loadRecentChats();
                return;
            }

            listTitle.textContent = "Search Results";
            userList.innerHTML = `<p style="color:#666; text-align:center; padding: 15px;">Searching member network...</p>`;

            try {
                const snapshot = await getDocs(collection(db, "users"));
                userList.innerHTML = "";
                let found = 0;

                snapshot.forEach((docSnap) => {
                    const targetUid = docSnap.id;
                    if (targetUid === currentUserId) return;

                    const userData = docSnap.data();
                    const name = (userData.fullName || userData.name || "").toLowerCase();
                    const vId = (userData.versityId || userData.studentId || "").toString().toLowerCase();

                    if (name.includes(queryText) || vId.includes(queryText)) {
                        found++;
                        renderSearchResult(targetUid, userData);
                    }
                });

                if (found === 0) {
                    userList.innerHTML = `<p style="color:#888; text-align:center; padding: 15px;">No underground users found for "${queryText}".</p>`;
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        function renderSearchResult(targetUid, userData) {
            const displayName = userData.fullName || userData.name || 'Anonymous';
            const avatarUrl = userData.photo || userData.avatar || defaultAvatar;

            const card = document.createElement('div');
            card.className = 'chat-card';
            card.innerHTML = `
                <div class="user-info">
                    <img class="user-avatar" src="${avatarUrl}" alt="Avatar">
                    <div class="user-details">
                        <h4>${displayName}</h4>
                        <p class="last-msg">ID: ${userData.versityId || 'N/A'}</p>
                    </div>
                </div>
                <a href="profile.html?uid=${targetUid}" class="btn-profile-link">View Profile</a>
            `;
            userList.appendChild(card);
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 300);
        });
    </script>
</body>
</html>
