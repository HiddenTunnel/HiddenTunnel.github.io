<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Chat - Find Friends</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        #mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 255, 114, 0.12) 0%, rgba(255, 122, 0, 0.04) 45%, transparent 70%);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: transform 0.04s linear;
        }

        .ambient-smoke {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
            background: url('assets/svg/smoke.svg') center/cover no-repeat;
            animation: smokeMove 25s infinite alternate ease-in-out;
        }

        @keyframes smokeMove {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-30px, 20px); }
        }

        nav ul {
            display: flex;
            align-items: center;
            gap: clamp(15px, 2vw, 32px);
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: #b0b0b0;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: clamp(0.85rem, 1vw, 0.95rem);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--green, #5CFF72);
        }

        @media (max-width: 768px) {
            nav ul { display: none !important; }
        }

        .friends-container {
            position: relative;
            z-index: 5;
            max-width: 800px;
            margin: 110px auto 60px auto;
            padding: 0 20px;
        }

        .search-card {
            background: var(--surface, #111111);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
        }

        .search-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 15px;
        }

        .search-title span { color: var(--green, #5CFF72); }

        .search-box-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 14px 22px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--green, #5CFF72);
            box-shadow: 0 0 15px rgba(92, 255, 114, 0.2);
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-item {
            background: rgba(17, 17, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            text-decoration: none;
        }

        .user-item:hover {
            transform: translateY(-2px);
            border-color: var(--green, #5CFF72);
            background: rgba(255, 255, 255, 0.03);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--green, #5CFF72);
            background: #222;
        }

        .user-details h3 {
            color: #fff;
            font-size: 1.05rem;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .user-details p {
            color: var(--orange, #FF7A00);
            font-family: monospace;
            font-size: 0.85rem;
        }

        .view-btn {
            background: rgba(92, 255, 114, 0.15);
            color: var(--green, #5CFF72);
            border: 1px solid var(--green, #5CFF72);
            padding: 8px 18px;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            color: var(--gray, #a5a5a5);
            padding: 40px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>
    <div class="ambient-smoke"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">
                UNDERGROUND <span>CHAT</span>
            </a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="user.html">Chats</a></li>
                <li><a href="friends.html" class="active">Friends</a></li>
                <li><a href="id.html">My ID</a></li>
            </ul>
        </nav>
    </header>

    <main class="friends-container">
        <div class="search-card">
            <h1 class="search-title">FIND <span>TAGGERS</span></h1>
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by Name or Versity ID...">
            </div>
        </div>

        <div class="results-list" id="resultsList">
            <div class="empty-state">Type a Name or Versity ID to search...</div>
        </div>
    </main>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        const searchInput = document.getElementById("searchInput");
        const resultsList = document.getElementById("resultsList");
        let searchTimeout = null;
        let currentUserId = null;
        let cachedUsers = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
            }
            await preloadUsers();
        });

        async function preloadUsers() {
            try {
                const usersRef = collection(db, "users");
                const snapshot = await getDocs(usersRef);
                cachedUsers = [];
                snapshot.forEach(docSnap => {
                    cachedUsers.push({ uid: docSnap.id, ...docSnap.data() });
                });
            } catch (err) {
                console.error("Error preloading users:", err);
            }
        }

        async function executeSearch() {
            const term = searchInput.value.trim().toLowerCase();

            if (!term) {
                resultsList.innerHTML = `<div class="empty-state">Type a Name or Versity ID to search...</div>`;
                return;
            }

            if (cachedUsers.length === 0) {
                resultsList.innerHTML = `<div class="empty-state">Searching database...</div>`;
                await preloadUsers();
            }

            const matchedUsers = cachedUsers.filter(u => {
                if (u.uid === currentUserId) return false;

                const fullName = (u.fullName || "").toLowerCase();
                const name = (u.name || "").toLowerCase();
                const displayName = (u.displayName || "").toLowerCase();
                const versityId = (u.versityId || u.studentId || "").toString().toLowerCase();
                const email = (u.email || "").toLowerCase();

                return fullName.includes(term) || 
                       name.includes(term) || 
                       displayName.includes(term) || 
                       versityId.includes(term) ||
                       email.includes(term);
            });

            renderUsers(matchedUsers);
        }

        function renderUsers(users) {
            if (users.length === 0) {
                resultsList.innerHTML = `<div class="empty-state">No taggers found matching your search.</div>`;
                return;
            }

            resultsList.innerHTML = users.map(u => {
                const name = u.fullName || u.name || u.displayName || 'Anonymous User';
                const avatar = u.photo || u.photoURL || u.avatar || defaultAvatar;
                const vId = u.versityId || u.studentId || u.uid.slice(0, 8);

                return `
                    <a href="friendsid.html?uid=${u.uid}" class="user-item">
                        <div class="user-info">
                            <img src="${avatar}" class="user-avatar" alt="pfp">
                            <div class="user-details">
                                <h3>${name}</h3>
                                <p>ID: ${vId}</p>
                            </div>
                        </div>
                        <span class="view-btn">View ID Card</span>
                    </a>
                `;
            }).join("");
        }

        searchInput.addEventListener("input", () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(executeSearch, 250);
        });
    </script>

    <!-- Mouse Glow Script -->
    <script>
        const glow = document.getElementById('mouse-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
