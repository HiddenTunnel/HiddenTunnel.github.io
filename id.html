<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versity ID Card - Underground Chat</title>
    <meta name="theme-color" content="#000000">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .id-wrapper {
            max-width: 440px;
            margin: 110px auto 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .id-card {
            background: linear-gradient(145deg, #121212 0%, #080808 100%);
            border: 2px solid rgba(63, 169, 169, 0.35);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(63, 169, 169, 0.12);
            position: relative;
            overflow: hidden;
        }

        .id-card::before {
            content: "OFFICIAL TAGGER";
            position: absolute;
            top: 18px;
            right: -30px;
            background: var(--orange, #ff9f68);
            color: #000;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 4px 35px;
            transform: rotate(45deg);
            letter-spacing: 1px;
            box-shadow: 0 2px 10px rgba(255, 159, 104, 0.3);
        }

        .id-header {
            text-align: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
            padding-bottom: 16px;
            margin-bottom: 22px;
        }

        .id-header h2 {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 1px;
            margin: 0;
        }

        .id-header h2 span {
            color: var(--green, #3fa9a9);
            text-shadow: 0 0 12px rgba(63, 169, 169, 0.4);
        }

        .id-header p {
            font-size: 0.75rem;
            color: var(--orange, #ff9f68);
            letter-spacing: 2px;
            margin-top: 4px;
            font-weight: 700;
        }

        .id-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .id-photo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--green, #3fa9a9);
            padding: 3px;
            background: #000;
            box-shadow: 0 0 22px rgba(63, 169, 169, 0.3);
            overflow: hidden;
        }

        .id-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .id-details {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(63, 169, 169, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        /* Fixed Row & Layout Alignment */
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 8px;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: #888;
            font-weight: 500;
            font-size: 0.82rem;
            flex-shrink: 0;
        }

        /* Fixed Value Overflow with Ellipsis */
        .detail-value {
            color: #fff;
            font-weight: 700;
            flex: 1;
            min-width: 0;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-value.highlight {
            color: var(--green, #3fa9a9);
            font-family: monospace;
            font-size: 1rem;
            text-shadow: 0 0 8px rgba(63, 169, 169, 0.25);
        }

        .add-phone-link {
            color: var(--orange, #ff9f68);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            margin-left: 5px;
            transition: opacity 0.2s;
        }

        .add-phone-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .card-actions {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-chat {
            background: var(--green, #3fa9a9);
            color: #000;
            box-shadow: 0 0 20px rgba(63, 169, 169, 0.3);
        }

        .btn-chat:hover {
            box-shadow: 0 0 25px rgba(63, 169, 169, 0.6);
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-action:hover {
            transform: translateY(-2px);
        }

        /* Bottom Nav Responsive CSS */
        #bottom-nav-container {
            display: none;
        }

        @media (max-width: 768px) {
            #bottom-nav-container {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>

    <!-- Dynamic Navigation Container (Loaded by navbar.js) -->
    <div id="navbar-container"></div>

    <div class="id-wrapper">
        <div class="id-card">
            <div class="id-header">
                <h2>UNDERGROUND <span>ID</span></h2>
                <p>VERSITY PASSPORT</p>
            </div>

            <div class="id-body">
                <div class="id-photo-container">
                    <img id="displayPhoto"
                         class="id-photo"
                         src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='8' r='4' fill='%233fa9a9'/><path d='M4 20c0-4 3.5-7 8-7s8 3 8 7' fill='%233fa9a9'/></svg>"
                         alt="Profile">
                </div>

                <div class="id-details">
                    <div class="detail-row">
                        <span class="detail-label">Full Name</span>
                        <span class="detail-value" id="displayName">Loading...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Versity ID</span>
                        <span class="detail-value highlight" id="displayVersityId">Loading...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value" id="displayEmail">Loading...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value" id="displayPhone">Loading...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value" id="displayStatus">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="card-actions">
                <a href="createaccount.html" class="btn-action btn-edit">Edit Profile</a>
                <a href="user.html" class="btn-action btn-chat">Enter Chat</a>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='8' r='4' fill='%233fa9a9'/><path d='M4 20c0-4 3.5-7 8-7s8 3 8 7' fill='%233fa9a9'/></svg>";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const currentUserId = localStorage.getItem("ug_current_user_id");

        onAuthStateChanged(auth, (user) => {
            const uid = user ? user.uid : currentUserId;

            if (!uid) {
                alert("Please login first.");
                window.location.href = "login.html";
                return;
            }

            // Realtime listener so any updates in Firestore immediately reflect on the ID card
            const docRef = doc(db, "users", uid);
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();

                    document.getElementById("displayName").textContent = data.fullName || data.name || "N/A";
                    document.getElementById("displayVersityId").textContent = data.versityId || "N/A";
                    document.getElementById("displayEmail").textContent = data.email || user?.email || "N/A";
                    document.getElementById("displayStatus").textContent = data.bio || data.status || "Underground Operator";
                    
                    const phoneElement = document.getElementById("displayPhone");
                    if (data.phone && data.phone.trim() !== "") {
                        phoneElement.textContent = data.phone;
                    } else {
                        phoneElement.innerHTML = `Not Added <a href="createaccount.html" class="add-phone-link">(+ Add)</a>`;
                    }

                    document.getElementById("displayPhoto").src = data.photo || data.avatar || DEFAULT_AVATAR;
                } else {
                    alert("Profile not found.");
                    window.location.href = "createaccount.html";
                }
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        });
    </script>

    <!-- Bottom/Desktop Nav Injector -->
    <script src="navbar.js"></script>

    <!-- Mobile Bottom Nav -->
    <div id="bottom-nav-container"></div>

    <script>
        if (window.innerWidth <= 768) {
            fetch("bottom-nav.html")
                .then(res => res.text())
                .then(data => {
                    document.getElementById("bottom-nav-container").innerHTML = data;
                });
        }
    </script>
</body>
</html>
