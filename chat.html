<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat - Underground Chat</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        header, nav, .top-nav, #navbar-container > header {
            display: none !important;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #080808;
            color: #fff;
            font-family: 'Outfit', sans-serif;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--green, #5CFF72);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            margin-right: 6px;
            border-radius: 50%;
        }

        .chat-container {
            max-width: 700px;
            margin: 5px auto 0 auto;
            height: calc(100dvh - 85px); 
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .chat-header {
            padding: 10px 14px;
            background: #181818;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--green, #5CFF72);
        }

        .header-info-details {
            display: flex;
            flex-direction: column;
        }

        .chat-header h2 {
            font-weight: 600;
            font-size: 0.98rem;
            color: #fff;
            margin: 0;
        }

        .status-text {
            font-size: 0.72rem;
            color: #888;
        }

        .status-text.online {
            color: #5CFF72;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            position: relative;
            user-select: none;
        }

        .message-row.mine-row {
            justify-content: flex-end;
        }

        .message-bubble {
            display: flex;
            gap: 10px;
            max-width: 82%;
            position: relative;
        }

        .message-bubble.mine {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--green, #5CFF72);
            flex-shrink: 0;
        }

        .message-content {
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 14px;
            color: #ddd;
            font-size: 0.88rem;
            position: relative;
            word-break: break-word;
            user-select: text;
        }

        .message-bubble.mine .message-content {
            background: var(--green, #5CFF72);
            color: #000;
            font-weight: 600;
        }

        .message-sender {
            font-size: 0.7rem;
            color: var(--orange, #FF7A00);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .message-bubble.mine .message-sender {
            color: #222;
            text-align: right;
        }

        .chat-media-img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            margin-top: 5px;
            display: block;
        }

        .file-attachment-link {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.2);
            padding: 6px 10px;
            border-radius: 6px;
            color: inherit;
            text-decoration: none;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 0.65rem;
            color: #888;
            margin-top: 3px;
        }

        .message-bubble.mine .message-meta { color: #333; }
        .msg-status.seen { color: #0084ff; }

        .reply-quote {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid var(--green, #5CFF72);
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.78rem;
        }

        .message-bubble.mine .reply-quote {
            background: rgba(0, 0, 0, 0.12);
            border-left-color: #000;
        }

        .typing-indicator-bar {
            padding: 4px 16px;
            font-size: 0.75rem;
            color: #5CFF72;
            font-style: italic;
            height: 20px;
        }

        .chat-input-wrapper {
            background: #181818;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .reply-banner {
            display: none;
            background: #141414;
            padding: 8px 14px;
            border-left: 4px solid var(--green, #5CFF72);
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.8rem;
        }

        .reply-banner.active { display: flex; }
        .cancel-reply-btn { background: transparent; border: none; color: #888; font-size: 1.1rem; cursor: pointer; }

        .chat-input-area {
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            color: #aaa;
        }

        .icon-btn:hover { color: #5CFF72; background: rgba(255,255,255,0.05); }

        .chat-input-area input[type="text"] {
            flex: 1;
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 10px 16px;
            color: #fff;
            outline: none;
            font-size: 0.88rem;
        }

        .send-btn {
            background: var(--green, #5CFF72);
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 10px 18px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
        }

        /* Context Menu Styles */
        #messageActions {
            position: fixed;
            background: #181818;
            border: 1px solid rgba(92, 255, 114, 0.3);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 500;
            box-shadow: 0 10px 30px #000;
        }

        #messageActions button {
            background: #222;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            text-align: left;
        }

        #messageActions button:hover { background: #5CFF72; color: #000; }
        #messageActions button.delete-btn:hover { background: #ff4d4d; color: #fff; }

        /* Emoji Picker Box Popup */
        .emoji-picker-popup {
            position: absolute;
            bottom: 60px;
            left: 10px;
            background: #181818;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
        }

        .emoji-picker-popup span {
            font-size: 1.3rem;
            cursor: pointer;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
        }

        .emoji-picker-popup span:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="noise"></div>

    <!-- Message Action Menu -->
    <div id="messageActions" style="display:none;">
        <button id="replyAction">↩ Reply</button>
        <button id="forwardAction">↪ Forward</button>
        <button id="copyAction">📋 Copy</button>
        <button id="deleteAction" class="delete-btn" style="display:none;">🗑️ Delete</button>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-user">
                <button id="backBtn" class="back-btn">❮</button>
                <img id="peerAvatar" class="chat-header-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Peer">
                <div class="header-info-details">
                    <h2 id="peerName">TUNNEL CHAT</h2>
                    <span id="userOnlineStatus" class="status-text">Offline</span>
                </div>
            </div>
            <small style="color: #888; font-size: 0.72rem;">Encrypted</small>
        </div>

        <div class="chat-messages" id="messagesList"></div>

        <!-- Typing Indicator Banner -->
        <div id="typingIndicator" class="typing-indicator-bar"></div>

        <div class="chat-input-wrapper">
            <div id="replyBanner" class="reply-banner">
                <div style="display:flex; flex-direction:column; overflow:hidden;">
                    <span id="replyBannerAuthor" style="color:#5CFF72; font-weight:700; font-size:0.72rem;">Replying</span>
                    <span id="replyBannerText" style="color:#aaa; font-size:0.8rem;">Snippet...</span>
                </div>
                <button id="cancelReplyBtn" class="cancel-reply-btn">✕</button>
            </div>

            <!-- Emoji Popup Window -->
            <div id="emojiPicker" class="emoji-picker-popup" style="display:none;">
                <span>👍</span><span>❤️</span><span>😂</span><span>🔥</span><span>🎉</span><span>😮</span>
                <span>😊</span><span>😎</span><span>🙏</span><span>✨</span><span>💯</span><span>👏</span>
            </div>

            <form class="chat-input-area" id="chatForm">
                <button type="button" id="emojiToggleBtn" class="icon-btn">🙂</button>
                
                <input type="file" id="fileAttachmentInput" style="display:none;">
                <button type="button" id="attachFileBtn" class="icon-btn">📎</button>

                <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
                <button type="submit" class="send-btn">SEND</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, doc, getDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp, writeBatch 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        // Step 1 - Bug #2 Fix: XSS Escape Helper Function
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');
        const peerUid = urlParams.get('peerUid');
        let currentUserId = localStorage.getItem("ug_current_user_id");

        const messagesList = document.getElementById('messagesList');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const peerName = document.getElementById('peerName');
        const peerAvatar = document.getElementById('peerAvatar');
        const userOnlineStatus = document.getElementById('userOnlineStatus');
        const typingIndicator = document.getElementById('typingIndicator');
        const attachFileBtn = document.getElementById('attachFileBtn');
        const fileAttachmentInput = document.getElementById('fileAttachmentInput');
        const emojiToggleBtn = document.getElementById('emojiToggleBtn');
        const emojiPicker = document.getElementById('emojiPicker');

        let activeReplyTarget = null;
        let selectedMessageForAction = null;
        let typingTimeout = null;
        const userProfilesCache = {};

        document.getElementById('backBtn').addEventListener('click', () => window.history.back());

        document.addEventListener('click', (e) => {
            const box = document.getElementById("messageActions");
            if (box && !box.contains(e.target)) box.style.display = "none";
            if (emojiPicker && !emojiPicker.contains(e.target) && e.target !== emojiToggleBtn) {
                emojiPicker.style.display = "none";
            }
        });

        // 1. Online / Offline Presence Updates
        function setupPresenceSystem(uid) {
            const userRef = doc(db, "users", uid);
            updateDoc(userRef, { online: true, lastSeen: serverTimestamp() }).catch(() => {});

            window.addEventListener("beforeunload", () => {
                updateDoc(userRef, { online: false, lastSeen: serverTimestamp() });
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                setupPresenceSystem(currentUserId);
            }
            if (peerUid) listenToPeerStatus(peerUid);
            if (chatId) {
                listenForMessages(chatId, currentUserId);
                listenForTypingStatus(chatId);
            }
        });

        // Listen for Peer's Online/Offline Realtime Status
        function listenToPeerStatus(pUid) {
            onSnapshot(doc(db, "users", pUid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    peerName.textContent = data.fullName || "User";
                    if (data.photo) peerAvatar.src = data.photo;
                    
                    if (data.online) {
                        userOnlineStatus.textContent = "🟢 Online";
                        userOnlineStatus.className = "status-text online";
                    } else {
                        userOnlineStatus.textContent = "Offline";
                        userOnlineStatus.className = "status-text";
                    }
                }
            });
        }

        // 2. Typing Indicator Logic
        messageInput.addEventListener("input", () => {
            if (!chatId || !currentUserId) return;
            const chatRef = doc(db, "chats", chatId);
            
            updateDoc(chatRef, { [`typing.${currentUserId}`]: true }).catch(() => {});
            clearTimeout(typingTimeout);

            typingTimeout = setTimeout(() => {
                updateDoc(chatRef, { [`typing.${currentUserId}`]: false }).catch(() => {});
            }, 2000);
        });

        function listenForTypingStatus(cId) {
            onSnapshot(doc(db, "chats", cId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const typingData = data.typing || {};
                    const isPeerTyping = Object.keys(typingData).some(id => id !== currentUserId && typingData[id] === true);
                    typingIndicator.textContent = isPeerTyping ? `${peerName.textContent} is typing...` : "";
                }
            });
        }

        // 3. Emoji Picker Integration
        emojiToggleBtn.addEventListener("click", () => {
            emojiPicker.style.display = emojiPicker.style.display === "none" ? "grid" : "none";
        });

        emojiPicker.querySelectorAll("span").forEach(emoji => {
            emoji.addEventListener("click", () => {
                messageInput.value += emoji.textContent;
                emojiPicker.style.display = "none";
                messageInput.focus();
            });
        });

        // 4. File / Image Uploading Feature
        attachFileBtn.addEventListener("click", () => fileAttachmentInput.click());

        fileAttachmentInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file || !chatId) return;

            const fileRef = ref(storage, `chat_files/${Date.now()}_${file.name}`);
            try {
                attachFileBtn.textContent = "⏳";
                const snap = await uploadBytes(fileRef, file);
                const downloadURL = await getDownloadURL(snap.ref);

                const isImage = file.type.startsWith("image/");
                const payload = {
                    senderId: currentUserId,
                    type: isImage ? "image" : "file",
                    status: "sent",
                    createdAt: serverTimestamp()
                };

                if (isImage) payload.imageURL = downloadURL;
                else {
                    payload.fileURL = downloadURL;
                    payload.fileName = file.name;
                }

                await addDoc(collection(db, "chats", chatId, "messages"), payload);
                await updateDoc(doc(db, "chats", chatId), {
                    lastMessage: isImage ? "📷 Image" : "📁 File",
                    lastSenderId: currentUserId,
                    updatedAt: serverTimestamp()
                });
            } catch (err) {
                console.error("File upload failed:", err);
                alert("Upload failed!");
            } finally {
                attachFileBtn.textContent = "📎";
                fileAttachmentInput.value = "";
            }
        });

        // 5. Message Render with XSS protection Applied
        async function renderMessage(msg, docId) {
            const isMine = msg.senderId === currentUserId;
            
            let contentHTML = `<div>${escapeHTML(msg.text)}</div>`;
            if (msg.imageURL) {
                contentHTML += `<img class="chat-media-img" src="${escapeHTML(msg.imageURL)}" alt="Shared image" />`;
            }
            if (msg.fileURL) {
                contentHTML += `<a class="file-attachment-link" href="${escapeHTML(msg.fileURL)}" target="_blank">📄 ${escapeHTML(msg.fileName || "Download Attachment")}</a>`;
            }

            let replyBlock = '';
            if (msg.replyTo) {
                replyBlock = `
                    <div class="reply-quote">
                        <div class="reply-quote-author">${escapeHTML(msg.replyTo.senderName)}</div>
                        <div style="color:#aaa;">${escapeHTML(msg.replyTo.text)}</div>
                    </div>
                `;
            }

            let forwardLabel = msg.isForwarded ? `<small style="color:#5CFF72; font-style:italic;">↪ Forwarded</small>` : '';

            return `
                <div class="message-row ${isMine ? 'mine-row' : ''}" 
                     data-id="${docId}"
                     data-sender-id="${msg.senderId}"
                     data-sender="${escapeHTML(isMine ? 'You' : peerName.textContent)}" 
                     data-text="${escapeHTML(msg.text || '')}"
                     oncontextmenu="openActions(event,'${docId}','${msg.senderId}','${escapeHTML(isMine ? 'You' : peerName.textContent)}','${escapeHTML(msg.text || '')}')">
                    
                    <div class="message-bubble ${isMine ? "mine" : ""}">
                        <div class="message-content">
                            ${forwardLabel}
                            ${replyBlock}
                            ${contentHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        window.openActions = function(e, id, senderId, name, text) {
            e.preventDefault();
            selectedMessageForAction = { id, senderId, senderName: name, text };
            
            const box = document.getElementById("messageActions");
            const deleteBtn = document.getElementById("deleteAction");

            // Show delete option only for own messages
            deleteBtn.style.display = (senderId === currentUserId) ? "block" : "none";
            box.style.display = "flex";

            let x = e.clientX, y = e.clientY;
            if (x + 180 > window.innerWidth) x = window.innerWidth - 190;
            if (y + 150 > window.innerHeight) y = window.innerHeight - 160;

            box.style.left = x + "px";
            box.style.top = y + "px";
        };

        // Message Delete Action Handler
        document.getElementById("deleteAction").onclick = async function() {
            if (!selectedMessageForAction || !chatId) return;
            if (confirm("Delete this message?")) {
                try {
                    await deleteDoc(doc(db, "chats", chatId, "messages", selectedMessageForAction.id));
                    document.getElementById("messageActions").style.display = "none";
                } catch (e) {
                    console.error("Delete failed:", e);
                }
            }
        };

        document.getElementById("replyAction").onclick = function() {
            if (!selectedMessageForAction) return;
            activeReplyTarget = selectedMessageForAction;
            document.getElementById("replyBannerAuthor").textContent = `Replying to ${selectedMessageForAction.senderName}`;
            document.getElementById("replyBannerText").textContent = selectedMessageForAction.text;
            document.getElementById("replyBanner").classList.add("active");
            document.getElementById("messageActions").style.display = "none";
            messageInput.focus();
        };

        document.getElementById("cancelReplyBtn").onclick = function() {
            activeReplyTarget = null;
            document.getElementById("replyBanner").classList.remove("active");
        };

        document.getElementById("forwardAction").onclick = function() {
            if (!selectedMessageForAction) return;
            localStorage.setItem("forwardMessage", JSON.stringify(selectedMessageForAction));
            window.location.href = "forward.html";
        };

        document.getElementById("copyAction").onclick = function() {
            if (selectedMessageForAction?.text) {
                navigator.clipboard.writeText(selectedMessageForAction.text);
            }
            document.getElementById("messageActions").style.display = "none";
        };

        function listenForMessages(cId, activeUid) {
            const q = query(collection(db, "chats", cId, "messages"), orderBy("createdAt", "asc"));
            onSnapshot(q, async (snapshot) => {
                messagesList.innerHTML = "";
                for (const docSnap of snapshot.docs) {
                    const rendered = await renderMessage(docSnap.data(), docSnap.id);
                    messagesList.insertAdjacentHTML("beforeend", rendered);
                }
                messagesList.scrollTop = messagesList.scrollHeight;
            });
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !chatId) return;

            const payload = {
                text: text,
                senderId: currentUserId,
                type: "text",
                status: "sent",
                createdAt: serverTimestamp()
            };

            if (activeReplyTarget) {
                payload.replyTo = {
                    id: activeReplyTarget.id,
                    senderName: activeReplyTarget.senderName,
                    text: activeReplyTarget.text
                };
            }

            messageInput.value = "";
            document.getElementById("replyBanner").classList.remove("active");

            await addDoc(collection(db, "chats", chatId, "messages"), payload);
            await updateDoc(doc(db, "chats", chatId), {
                lastMessage: text,
                lastSenderId: currentUserId,
                updatedAt: serverTimestamp(),
                [`typing.${currentUserId}`]: false
            });
        });
    </script>
</body>
</html>
