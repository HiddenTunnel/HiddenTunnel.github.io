<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat - Underground Chat</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* 🔴 Remove Top Navigation Header injected by navbar.js */
        header, nav, .top-nav, #navbar-container > header {
            display: none !important;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent page scrolling */
            background-color: #080808;
            color: #fff;
            font-family: 'Outfit', sans-serif;
        }

        /* Back Button Styling */
        .back-btn {
            background: transparent;
            border: none;
            color: var(--green, #5CFF72);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            margin-right: 6px;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 📱 Fixed Mobile Chat Box Layout */
        .chat-container {
            max-width: 700px;
            margin: 5px auto 0 auto;
            height: calc(100dvh - 85px); 
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .chat-header {
            padding: 10px 14px;
            background: #181818;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--green, #5CFF72);
        }

        .chat-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            margin: 0;
        }

        .chat-header h2 span {
            color: var(--green, #5CFF72);
        }

        .chat-messages {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        /* Message Bubble Container & Reply Button Wrapper */
        .message-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            position: relative;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        .message-row.mine-row {
            justify-content: flex-end;
        }

        .message-bubble {
            display: flex;
            gap: 10px;
            max-width: 82%;
            position: relative;
        }

        .message-bubble.mine {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--green, #5CFF72);
            flex-shrink: 0;
        }

        .message-content {
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 14px;
            color: #ddd;
            font-size: 0.88rem;
            position: relative;
            word-break: break-word;
        }

        .message-bubble.mine .message-content {
            background: var(--green, #5CFF72);
            color: #000;
            font-weight: 600;
        }

        .message-sender {
            font-size: 0.7rem;
            color: var(--orange, #FF7A00);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .message-bubble.mine .message-sender {
            color: #222;
            text-align: right;
        }

        /* Message Meta (Time & Status Ticks) */
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 0.65rem;
            color: #888;
            margin-top: 3px;
        }

        .message-bubble.mine .message-meta {
            color: #333;
        }

        .msg-status {
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: -1px;
        }

        .msg-status.seen {
            color: #0084ff; /* Messenger Blue for Seen */
        }

        /* Quoted/Replied Message Block Inside Bubble */
        .reply-quote {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid var(--green, #5CFF72);
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.78rem;
        }

        .message-bubble.mine .reply-quote {
            background: rgba(0, 0, 0, 0.12);
            border-left-color: #000;
        }

        .reply-quote-author {
            font-weight: 700;
            font-size: 0.7rem;
            color: var(--green, #5CFF72);
        }

        .message-bubble.mine .reply-quote-author {
            color: #000;
        }

        .reply-quote-text {
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .message-bubble.mine .reply-quote-text {
            color: #222;
        }

        /* Desktop Reply Hover Button */
        .desktop-reply-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .desktop-reply-btn img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .message-row:hover .desktop-reply-btn {
            opacity: 1;
            visibility: visible;
        }

        .desktop-reply-btn:hover {
            background: var(--green, #5CFF72);
            border-color: var(--green, #5CFF72);
        }

        /* Chat Input Area & Active Reply Preview Banner */
        .chat-input-wrapper {
            background: #181818;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .reply-banner {
            display: none;
            background: #141414;
            padding: 8px 14px;
            border-left: 4px solid var(--green, #5CFF72);
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .reply-banner.active {
            display: flex;
        }

        .reply-banner-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .reply-banner-author {
            color: var(--green, #5CFF72);
            font-weight: 700;
            font-size: 0.72rem;
        }

        .reply-banner-text {
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cancel-reply-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .cancel-reply-btn:hover {
            color: #ff4d4d;
        }

        .chat-input-area {
            padding: 10px;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 10px 16px;
            color: #fff;
            outline: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem;
        }

        .chat-input-area input:focus {
            border-color: var(--green, #5CFF72);
        }

        .send-btn {
            background: var(--green, #5CFF72);
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 0 18px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="noise"></div>
 
    <!-- Dynamic Navigation Container -->
    <div id="navbar-container"></div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-user">
                <!-- ⬅️ Back Button -->
                <button id="backBtn" class="back-btn" aria-label="Go Back">❮</button>
                
                <img id="peerAvatar" class="chat-header-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Peer">
                <h2 id="peerName">TUNNEL <span>CHAT</span></h2>
            </div>
            <small style="color: #888; font-size: 0.72rem;">Encrypted</small>
        </div>

        <div class="chat-messages" id="messagesList">
            <!-- Messages load here -->
        </div>

        <div class="chat-input-wrapper">
            <!-- Reply Banner Preview -->
            <div id="replyBanner" class="reply-banner">
                <div class="reply-banner-info">
                    <span id="replyBannerAuthor" class="reply-banner-author">Replying to User</span>
                    <span id="replyBannerText" class="reply-banner-text">Sample message snippet...</span>
                </div>
                <button id="cancelReplyBtn" class="cancel-reply-btn" aria-label="Cancel Reply">✕</button>
            </div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
                <button type="submit" class="send-btn">SEND</button>
            </form>
        </div>
    </div>

    <!-- FIREBASE SDKs & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            doc, 
            getDoc, 
            updateDoc, 
            query, 
            orderBy, 
            onSnapshot, 
            serverTimestamp,
            writeBatch
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Back Button Logic
        const backBtn = document.getElementById('backBtn');
        backBtn.addEventListener('click', () => {
            if (document.referrer && (document.referrer.includes("user.html") || document.referrer.includes("friends.html"))) {
                window.history.back();
            } else {
                window.location.href = "user.html";
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');
        const peerUid = urlParams.get('peerUid');

        const currentUserId = localStorage.getItem("ug_current_user_id");
        let currentUserProfile = null;
        let activeReplyTarget = null;
        
        // Caching user profiles to dynamically load current photo/name
        const userProfilesCache = {};

        const messagesList = document.getElementById('messagesList');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const peerName = document.getElementById('peerName');
        const peerAvatar = document.getElementById('peerAvatar');
        
        const replyBanner = document.getElementById('replyBanner');
        const replyBannerAuthor = document.getElementById('replyBannerAuthor');
        const replyBannerText = document.getElementById('replyBannerText');
        const cancelReplyBtn = document.getElementById('cancelReplyBtn');

        onAuthStateChanged(auth, async (user) => {
            if (!user && !currentUserId) {
                window.location.href = "login.html";
                return;
            }

            const activeUid = user ? user.uid : currentUserId;
            await loadCurrentUser(activeUid);

            if (!chatId) {
                messagesList.innerHTML = `<p style="color:#888; text-align:center; margin: auto;">Select a conversation to start chatting.</p>`;
                chatForm.style.display = "none";
                return;
            }

            if (peerUid) {
                loadPeerProfile(peerUid);
            }

            listenForMessages(chatId, activeUid);
        });

        async function loadCurrentUser(uid) {
            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    currentUserProfile = userSnap.data();
                    userProfilesCache[uid] = currentUserProfile; // Cache self profile
                }
            } catch (error) {
                console.error("Error loading profile:", error);
            }
        }

        async function loadPeerProfile(pUid) {
            try {
                const peerRef = doc(db, "users", pUid);
                const peerSnap = await getDoc(peerRef);
                if (peerSnap.exists()) {
                    const data = peerSnap.data();
                    userProfilesCache[pUid] = data; // Cache peer profile
                    peerName.innerHTML = `${data.fullName || 'Tagger'} <span>SIGNAL</span>`;
                    if (data.photo) peerAvatar.src = data.photo;
                }
            } catch (err) {
                console.error("Peer Profile Load Error:", err);
            }
        }

        // Fetch user profile dynamically (realtime check if updated)
        async function getSenderProfile(senderId) {
            if (userProfilesCache[senderId]) {
                return userProfilesCache[senderId];
            }
            try {
                const userRef = doc(db, "users", senderId);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    userProfilesCache[senderId] = userSnap.data();
                    return userProfilesCache[senderId];
                }
            } catch (e) {
                console.error("Error fetching sender profile:", e);
            }
            return { fullName: "Anonymous", photo: "" };
        }

        function setReplyTarget(id, senderName, text) {
            activeReplyTarget = { id, senderName, text };
            replyBannerAuthor.textContent = `Replying to ${senderName}`;
            replyBannerText.textContent = text;
            replyBanner.classList.add('active');
            messageInput.focus();
        }

        function clearReplyTarget() {
            activeReplyTarget = null;
            replyBanner.classList.remove('active');
        }

        cancelReplyBtn.addEventListener('click', clearReplyTarget);

        async function renderMessage(msg, docId) {
            const myUid = auth.currentUser ? auth.currentUser.uid : currentUserId;
            const isMine = msg.senderId === myUid;
            
            // Fetch latest sender profile live from cache/DB so photo updates instantly everywhere!
            const senderProfile = await getSenderProfile(msg.senderId);
            const senderName = isMine ? "You" : (senderProfile.fullName || msg.senderName || "Tagger");
            const senderPhoto = senderProfile.photo || msg.senderPhoto || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80';

            let replyBlock = '';
            if (msg.replyTo) {
                replyBlock = `
                    <div class="reply-quote">
                        <div class="reply-quote-author">${msg.replyTo.senderName || 'Signal'}</div>
                        <div class="reply-quote-text">${msg.replyTo.text || ''}</div>
                    </div>
                `;
            }

            // Messenger Status Indicators logic
            let statusHTML = '';
            if (isMine) {
                let ticks = '✓'; // sent
                let statusClass = '';
                if (msg.status === 'delivered') {
                    ticks = '✓✓';
                } else if (msg.status === 'seen') {
                    ticks = '✓✓';
                    statusClass = 'seen';
                }
                statusHTML = `<span class="msg-status ${statusClass}" title="${msg.status || 'sent'}">${ticks}</span>`;
            }

            const escapedText = (msg.text || '').replace(/"/g, '&quot;');
            const escapedName = senderName.replace(/"/g, '&quot;');

            return `
                <div class="message-row ${isMine ? 'mine-row' : ''}" data-id="${docId}" data-sender="${escapedName}" data-text="${escapedText}">
                    ${isMine ? `
                        <button class="desktop-reply-btn" title="Reply" onclick="window.triggerReply('${docId}', '${escapedName}', '${escapedText}')">
                            <img src="assets/svg/reply.svg" alt="Reply">
                        </button>
                    ` : ''}
                    
                    <div class="message-bubble ${isMine ? "mine" : ""}">
                        <img class="message-avatar" src="${senderPhoto}" alt="Avatar">
                        <div class="message-content">
                            ${replyBlock}
                            <div class="message-sender">${senderName}</div>
                            <div>${msg.text || ""}</div>
                            <div class="message-meta">
                                ${statusHTML}
                            </div>
                        </div>
                    </div>

                    ${!isMine ? `
                        <button class="desktop-reply-btn" title="Reply" onclick="window.triggerReply('${docId}', '${escapedName}', '${escapedText}')">
                            <img src="asset/svg/reply.svg" alt="Reply">
                        </button>
                    ` : ''}
                </div>
            `;
        }

        window.triggerReply = function(id, senderName, text) {
            setReplyTarget(id, senderName, text);
        };

        function attachSwipeGestures() {
            const rows = document.querySelectorAll('.message-row');
            rows.forEach(row => {
                let startX = 0;
                let currentX = 0;
                let isSwiping = false;

                row.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isSwiping = true;
                }, { passive: true });

                row.addEventListener('touchmove', (e) => {
                    if (!isSwiping) return;
                    currentX = e.touches[0].clientX;
                    const diffX = currentX - startX;

                    if (Math.abs(diffX) < 80) {
                        row.style.transform = `translateX(${diffX}px)`;
                    }
                }, { passive: true });

                row.addEventListener('touchend', () => {
                    if (!isSwiping) return;
                    isSwiping = false;
                    const diffX = currentX - startX;

                    if (Math.abs(diffX) > 50) {
                        const id = row.getAttribute('data-id');
                        const sender = row.getAttribute('data-sender');
                        const text = row.getAttribute('data-text');
                        setReplyTarget(id, sender, text);
                    }

                    row.style.transform = 'translateX(0px)';
                    startX = 0;
                    currentX = 0;
                });
            });
        }

        async function markMessagesAsSeenOrDelivered(snapshot, activeUid) {
            const batch = writeBatch(db);
            let hasUpdates = false;

            snapshot.forEach((docSnap) => {
                const msgData = docSnap.data();
                const msgId = docSnap.id;

                if (msgData.senderId !== activeUid) {
                    if (msgData.status !== 'seen') {
                        const msgRef = doc(db, "chats", chatId, "messages", msgId);
                        batch.update(msgRef, { status: 'seen' });
                        hasUpdates = true;
                    }
                } else {
                    if (msgData.status === 'sent') {
                        const msgRef = doc(db, "chats", chatId, "messages", msgId);
                        batch.update(msgRef, { status: 'delivered' });
                        hasUpdates = true;
                    }
                }
            });

            if (hasUpdates) {
                try {
                    await batch.commit();
                } catch (err) {
                    console.error("Batch update status error:", err);
                }
            }
        }

        function listenForMessages(cId, activeUid) {
            const messagesQuery = query(
                collection(db, "chats", cId, "messages"),
                orderBy("createdAt", "asc")
            );

            onSnapshot(messagesQuery, async (snapshot) => {
                messagesList.innerHTML = "";
                if (snapshot.empty) {
                    messagesList.innerHTML = `<p style="color:#555; text-align:center; margin: auto;">No signals yet. Leave your mark!</p>`;
                } else {
                    await markMessagesAsSeenOrDelivered(snapshot, activeUid);
                }

                // Render all messages with dynamic live profiles
                for (const docSnap of snapshot.docs) {
                    const msg = docSnap.data();
                    const renderedHTML = await renderMessage(msg, docSnap.id);
                    messagesList.insertAdjacentHTML("beforeend", renderedHTML);
                }
                
                attachSwipeGestures();
                messagesList.scrollTop = messagesList.scrollHeight;
            }, (error) => {
                console.error("Realtime Messages Error:", error);
            });
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !chatId) return;

            messageInput.disabled = true;

            try {
                const now = serverTimestamp();
                const activeUid = auth.currentUser ? auth.currentUser.uid : currentUserId;
                
                const messagePayload = {
                    text: text,
                    senderId: activeUid,
                    type: "text",
                    status: "sent",
                    createdAt: now
                };

                if (activeReplyTarget) {
                    messagePayload.replyTo = {
                        id: activeReplyTarget.id,
                        senderName: activeReplyTarget.senderName,
                        text: activeReplyTarget.text
                    };
                }

                await addDoc(collection(db, "chats", chatId, "messages"), messagePayload);

                const chatRef = doc(db, "chats", chatId);
                await updateDoc(chatRef, {
                    lastMessage: text,
                    lastSenderId: activeUid,
                    isRead: false,
                    updatedAt: now
                });

                messageInput.value = "";
                clearReplyTarget();
                messageInput.focus();
            } catch (error) {
                console.error("Error sending message:", error);
            } finally {
                messageInput.disabled = false;
            }
        });
    </script>

    <!-- Bottom Nav Injector -->
    <script src="navbar.js"></script>
</body>
</html>
