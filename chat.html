<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground Chat</title>
    <meta name="theme-color" content="#000000">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --green: #3fa9a9;
            --orange: #ffb09c;
            --bg: #000000;
            --card-bg: #0d0d0d;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        header, nav, .top-nav, #navbar-container > header, .bottom-nav {
            display: none !important;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #0d2525 0%, #000000 70%);
        }

        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 100dvh;
            margin: 0 auto;
            background: #080808;
            border: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
        }

        .chat-header {
            height: 60px;
            flex-shrink: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 20;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .peer-info-trigger {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--green);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .peer-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--green);
        }

        .peer-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .peer-info p {
            font-size: 0.75rem;
            color: #888;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.sent {
            align-self: flex-end;
            background: var(--green);
            color: #000;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .message-bubble.received {
            align-self: flex-start;
            background: #181818;
            color: #eee;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sender-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--orange);
            margin-bottom: 3px;
            display: block;
        }

        .msg-time {
            font-size: 0.65rem;
            display: block;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }

        .chat-input-wrapper {
            flex-shrink: 0;
            padding: 12px 16px;
            background: #111111;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-form input {
            flex: 1;
            background: #050505;
            border: 1px solid rgba(63, 169, 169, 0.2);
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input-form input:focus {
            border-color: var(--green);
        }

        .send-btn {
            background: var(--green);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: #000;
        }

        .profile-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }

        .profile-modal-card {
            width: 90%;
            max-width: 320px;
            background: #111111;
            border: 1px solid rgba(63, 169, 169, 0.3);
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--green);
            box-shadow: 0 0 15px rgba(63, 169, 169, 0.25);
            margin-bottom: 12px;
        }

        .modal-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .modal-sub {
            font-size: 0.78rem;
            color: #888;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .modal-action-btn {
            width: 100%;
            padding: 12px;
            background: var(--green);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }

        .modal-action-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 768px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }

            .chat-container {
                height: 100dvh;
                width: 100%;
                border-radius: 0;
                margin: 0;
            }

            .chat-header {
                height: 60px;
                flex-shrink: 0;
            }

            .chat-messages {
                flex: 1;
                overflow-y: auto;
                padding-bottom: 10px;
            }

            .chat-input-wrapper {
                flex-shrink: 0;
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" id="backBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div class="peer-info-trigger" id="peerInfoTrigger">
                    <img id="peerAvatar" class="peer-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233FA9A9'><circle cx='12' cy='12' r='10'/></svg>" alt="Avatar">
                    <div class="peer-info">
                        <h3 id="peerName">Loading...</h3>
                        <p id="peerStatus">Online</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Dynamic Messages -->
        </div>

        <!-- Chat Input Form -->
        <div class="chat-input-wrapper">
            <form class="chat-input-form" id="chatForm">
                <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off" required>
                <button type="submit" class="send-btn" id="sendBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Peer Profile Modal -->
    <div class="profile-modal-overlay" id="profileModal">
        <div class="profile-modal-card">
            <button class="modal-close-btn" id="closeModalBtn">✕</button>
            <img id="modalAvatar" class="modal-avatar" src="" alt="User Avatar">
            <h3 id="modalName" class="modal-name">User Name</h3>
            <p id="modalSub" class="modal-sub">ID: ...</p>
            <button class="modal-action-btn" id="viewIdBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                View Profile ID
            </button>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            orderBy, 
            onSnapshot, 
            serverTimestamp, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            arrayRemove 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const messageSound = new Audio("assets/sounds/notification.mp3");
        messageSound.preload = "auto";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');
        const peerUid = urlParams.get('peerUid') || urlParams.get('peerId');

        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const peerName = document.getElementById('peerName');
        const peerAvatar = document.getElementById('peerAvatar');
        const backBtn = document.getElementById('backBtn');
        const peerInfoTrigger = document.getElementById('peerInfoTrigger');

        const profileModal = document.getElementById('profileModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalAvatar = document.getElementById('modalAvatar');
        const modalName = document.getElementById('modalName');
        const modalSub = document.getElementById('modalSub');
        const viewIdBtn = document.getElementById('viewIdBtn');

        let currentUserId = null;
        let currentSenderProfile = null;
        let isPeerDeleted = false;
        let lastSenderId = null;
        let unsubscribeSnapshot = null;
        let isSending = false;

        backBtn.onclick = () => window.location.href = "user.html";

        peerInfoTrigger.onclick = () => {
            profileModal.style.display = "flex";
        };

        closeModalBtn.onclick = () => {
            profileModal.style.display = "none";
        };

        profileModal.onclick = (e) => {
            if (e.target === profileModal) profileModal.style.display = "none";
        };

        viewIdBtn.onclick = () => {
            if (peerUid) {
                window.location.href = `friendsid.html?uid=${peerUid}`;
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                if (!chatId || !peerUid) {
                    alert("Invalid Chat Room");
                    window.location.href = "user.html";
                    return;
                }
                await fetchCurrentUserProfile();
                await loadPeerInfo();
                listenMessages();
            } else {
                window.location.href = "login.html";
            }
        });

        async function fetchCurrentUserProfile() {
            try {
                const mySnap = await getDoc(doc(db, "users", currentUserId));
                if (mySnap.exists()) {
                    const data = mySnap.data();
                    currentSenderProfile = {
                        senderName: data.fullName || data.name || "User",
                        senderPhoto: data.photo || data.photoURL || data.avatar || ""
                    };
                }
            } catch (e) {
                console.error("User profile fetch error:", e);
            }
        }

        async function loadPeerInfo() {
            try {
                const userSnap = await getDoc(doc(db, "users", peerUid));
                
                if (userSnap.exists()) {
                    const data = userSnap.data();

                    if (data.deleted === true) {
                        isPeerDeleted = true;
                        peerName.textContent = "Deleted Account";
                        peerAvatar.src = "assets/img/deleted-user.png";
                        modalName.textContent = "Deleted Account";
                        modalAvatar.src = peerAvatar.src;
                        modalSub.textContent = "This account no longer exists.";
                        viewIdBtn.style.display = "none";
                        return;
                    }

                    const name = data.fullName || data.name || "User";
                    const photo = data.photo || data.photoURL || data.avatar || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233FA9A9'><circle cx='12' cy='12' r='10'/></svg>";
                    
                    peerName.textContent = name;
                    peerAvatar.src = photo;

                    modalName.textContent = name;
                    modalAvatar.src = photo;
                    modalSub.textContent = data.versityId ? `ID: ${data.versityId}` : `UID: ${peerUid.slice(0, 8)}`;
                } else {
                    isPeerDeleted = true;
                    peerName.textContent = "Deleted Account";
                    peerAvatar.src = "assets/img/deleted-user.png";
                    modalName.textContent = "Deleted Account";
                    modalAvatar.src = peerAvatar.src;
                    modalSub.textContent = "This account no longer exists.";
                    viewIdBtn.style.display = "none";
                }
            } catch (err) {
                console.error("Peer details fetch error:", err);
            }
        }

        function listenMessages() {
            try {
                updateDoc(doc(db, "chats", chatId), {
                    unreadBy: arrayRemove(currentUserId)
                });
            } catch (err) {
                console.warn("Could not clear unreadBy status:", err);
            }

            const msgsRef = collection(db, "chats", chatId, "messages");
            const q = query(msgsRef, orderBy("timestamp", "asc"));

            let initialLoad = true;

            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    const msg = change.doc.data();

                    if (change.type === "added") {
                        renderMessage(msg);

                        if (
                            !initialLoad &&
                            !change.doc.metadata.hasPendingWrites &&
                            msg.senderId !== currentUserId
                        ) {
                            messageSound.currentTime = 0;
                            messageSound.play().catch(() => {});
                        }
                    }
                });

                const atBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 120;
                if (atBottom || chatMessages.children.length <= 1) {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                initialLoad = false;
            });
        }

        function renderMessage(msg) {
            const bubble = document.createElement("div");
            const isSent = msg.senderId === currentUserId;
            
            const sameSender = lastSenderId === msg.senderId;
            lastSenderId = msg.senderId;

            bubble.className = `message-bubble ${isSent ? 'sent' : 'received'}`;

            if (sameSender) {
                bubble.style.marginTop = "-6px";
            } else {
                bubble.style.marginTop = "10px";
            }
            
            const timeStr = msg.timestamp?.toDate 
                ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
                : '';

            let senderNameHTML = "";
            if (!isSent && !sameSender && msg.senderName) {
                senderNameHTML = `<span class="sender-title">${escapeHTML(msg.senderName)}</span>`;
            }

            bubble.innerHTML = `
                ${senderNameHTML}
                ${escapeHTML(msg.text || '')}
                <span class="msg-time">${timeStr}</span>
            `;

            chatMessages.appendChild(bubble);
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (isSending) return;

            if (isPeerDeleted) {
                alert("This account has been deleted.");
                return;
            }

            const text = messageInput.value.trim();
            if (!text || !currentUserId) return;

            isSending = true;
            sendBtn.disabled = true;
            messageInput.value = "";

            try {
                const payload = {
                    senderId: currentUserId,
                    text: text,
                    timestamp: serverTimestamp()
                };

                if (currentSenderProfile) {
                    payload.senderName = currentSenderProfile.senderName;
                    payload.senderPhoto = currentSenderProfile.senderPhoto;
                }

                await addDoc(collection(db, "chats", chatId, "messages"), payload);

                await setDoc(doc(db, "chats", chatId), {
                    members: [currentUserId, peerUid],
                    lastMessage: text,
                    lastSenderId: currentUserId,
                    unreadBy: [peerUid],
                    updatedAt: serverTimestamp()
                }, { merge: true });

            } catch (err) {
                console.error("Failed to send message:", err);
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });

        window.addEventListener("beforeunload", () => {
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
