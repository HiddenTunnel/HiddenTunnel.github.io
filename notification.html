<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Underground Chat</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        #mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 255, 114, 0.12) 0%, rgba(255, 122, 0, 0.04) 45%, transparent 70%);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .notif-container {
            max-width: 800px;
            margin: 120px auto 60px auto;
            padding: 0 20px;
            position: relative;
            z-index: 5;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .section-header h1 {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.8rem;
            color: #fff;
            margin: 0;
        }

        .section-header h1 span { color: var(--green, #5CFF72); }

        .notif-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .notif-tab {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .notif-tab.active {
            background: rgba(92, 255, 114, 0.15);
            color: var(--green, #5CFF72);
            border-color: var(--green, #5CFF72);
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notif-card {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .notif-card.unread {
            border-left: 4px solid var(--green, #5CFF72);
            background: #161616;
        }

        .notif-icon-box {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .notif-icon-box img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .notif-content { flex: 1; }
        .notif-title { color: #fff; font-size: 1rem; font-weight: 700; margin: 0 0 4px 0; }
        .notif-desc { color: #a5a5a5; font-size: 0.9rem; margin: 0 0 10px 0; }
        .notif-time { color: #666; font-size: 0.78rem; font-weight: 600; }

        .notif-actions {
            display: flex; gap: 10px; margin-top: 10px;
        }

        .btn-notif {
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-notif-primary { background: var(--green, #5CFF72); color: #050505; }
        .btn-notif-secondary { background: rgba(255, 255, 255, 0.08); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.15); }

        .empty-notif {
            text-align: center; color: #666; padding: 60px 0; font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <header>
        <nav>
            <a href="index.html" class="logo">UNDERGROUND <span>CHAT</span></a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="user.html">Crew</a></li>
                <li><a href="notification.html" style="color: var(--green, #5CFF72);">Alerts</a></li>
                <li><a href="id.html">My ID</a></li>
            </ul>
        </nav>
    </header>

    <div class="notif-container">
        <div class="section-header">
            <h1>TUNNEL <span>ALERTS</span></h1>
        </div>

        <div class="notif-tabs">
            <button class="notif-tab active" data-filter="all">All Alerts</button>
            <button class="notif-tab" data-filter="requests">Requests</button>
            <button class="notif-tab" data-filter="messages">Messages</button>
        </div>

        <div class="notif-list" id="notifList">
            <div class="empty-notif">Listening for underground signals...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        const notifList = document.getElementById("notifList");
        let currentUserId = null;
        let activeFilter = "all";

        let friendRequests = [];
        let chatAlerts = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                listenToFriendRequests();
                listenToChatAlerts();
            } else {
                window.location.href = "login.html";
            }
        });

        function listenToFriendRequests() {
            const q = query(collection(db, "friendRequests"), where("to", "==", currentUserId));
            
            onSnapshot(q, async (snapshot) => {
                friendRequests = [];
                for (let docSnap of snapshot.docs) {
                    const reqData = docSnap.data();
                    let senderData = {};
                    try {
                        const senderDoc = await getDoc(doc(db, "users", reqData.from));
                        if (senderDoc.exists()) senderData = senderDoc.data();
                    } catch (e) { console.warn("Could not fetch user profile", e); }

                    friendRequests.push({
                        id: docSnap.id,
                        fromUid: reqData.from,
                        type: "request",
                        icon: senderData.photo || senderData.avatar || defaultAvatar,
                        title: senderData.fullName || senderData.name || "Unknown Operator",
                        desc: "sent you a crew connection request.",
                        time: "Pending Request",
                        unread: true
                    });
                }
                renderAllNotifications();
            }, (error) => {
                console.error("Friend Request listener error:", error);
            });
        }

        function listenToChatAlerts() {
            const q = query(collection(db, "chats"), where("members", "array-contains", currentUserId));
            
            onSnapshot(q, async (snapshot) => {
                chatAlerts = [];
                for (let docSnap of snapshot.docs) {
                    const data = docSnap.data();
                    if (data.lastSenderId && data.lastSenderId !== currentUserId && data.isRead === false) {
                        let senderData = {};
                        try {
                            const senderDoc = await getDoc(doc(db, "users", data.lastSenderId));
                            if (senderDoc.exists()) senderData = senderDoc.data();
                        } catch (e) { console.warn("Could not fetch sender info", e); }

                        chatAlerts.push({
                            id: docSnap.id,
                            peerUid: data.lastSenderId,
                            type: "message",
                            icon: senderData.photo || senderData.avatar || defaultAvatar,
                            title: `New Signal from ${senderData.fullName || senderData.name || 'Crew'}`,
                            desc: `"${data.lastMessage || 'Sent a message'}"`,
                            time: "Unread Message",
                            unread: true
                        });
                    }
                }
                renderAllNotifications();
            }, (error) => {
                console.error("Chat Alerts listener error:", error);
            });
        }

        function renderAllNotifications() {
            notifList.innerHTML = "";
            let combined = [...friendRequests, ...chatAlerts];

            if (activeFilter === "requests") combined = combined.filter(n => n.type === "request");
            if (activeFilter === "messages") combined = combined.filter(n => n.type === "message");

            if (combined.length === 0) {
                notifList.innerHTML = `<div class="empty-notif">No active signals found in the tunnel. 🟢</div>`;
                return;
            }

            combined.forEach(notif => {
                const card = document.createElement("div");
                card.className = `notif-card ${notif.unread ? 'unread' : ''}`;

                card.innerHTML = `
                    <div class="notif-icon-box">
                        <img src="${notif.icon}" alt="Avatar">
                    </div>
                    <div class="notif-content">
                        <h3 class="notif-title">${notif.title}</h3>
                        <p class="notif-desc">${notif.desc}</p>
                        <span class="notif-time">${notif.time}</span>
                        ${notif.type === 'request' ? `
                            <div class="notif-actions">
                                <button class="btn-notif btn-notif-primary accept-btn" data-req-id="${notif.id}" data-from="${notif.fromUid}">Accept</button>
                                <button class="btn-notif btn-notif-secondary decline-btn" data-req-id="${notif.id}">Decline</button>
                            </div>
                        ` : `
                            <div class="notif-actions">
                                <a href="chat.html?chatId=${notif.id}&peerUid=${notif.peerUid}" class="btn-notif btn-notif-primary">Open Chat</a>
                            </div>
                        `}
                    </div>
                `;
                notifList.appendChild(card);
            });

            document.querySelectorAll(".accept-btn").forEach(btn => {
                btn.onclick = () => acceptFriendRequest(btn.dataset.reqId, btn.dataset.from);
            });

            document.querySelectorAll(".decline-btn").forEach(btn => {
                btn.onclick = () => declineFriendRequest(btn.dataset.reqId);
            });
        }

        async function acceptFriendRequest(requestId, fromUid) {
            try {
                await setDoc(doc(db, "friends", `${currentUserId}_${fromUid}`), {
                    user1: currentUserId,
                    user2: fromUid,
                    timestamp: Date.now()
                });
                await setDoc(doc(db, "friends", `${fromUid}_${currentUserId}`), {
                    user1: fromUid,
                    user2: currentUserId,
                    timestamp: Date.now()
                });
                await deleteDoc(doc(db, "friendRequests", requestId));
            } catch (err) {
                console.error("Accept error:", err);
            }
        }

        async function declineFriendRequest(requestId) {
            try {
                await deleteDoc(doc(db, "friendRequests", requestId));
            } catch (err) {
                console.error("Decline error:", err);
            }
        }

        document.querySelectorAll(".notif-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".notif-tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                activeFilter = tab.dataset.filter;
                renderAllNotifications();
            });
        });
    </script>
</body>
</html>
