<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Underground Chat</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --green: #3FA9A9;
            --orange: #FFB09C;
            --red: #FF4D4D;
            --bg: #050505;
            --surface: #111111;
            --border: rgba(255, 255, 255, 0.08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            padding-bottom: 90px;
        }

        .noise {
            position: fixed;
            inset: 0;
            background-image: url('assets/svg/graffiti-wall.svg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        #mouse-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(63, 169, 169, 0.1) 0%, rgba(255, 176, 156, 0.03) 45%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        /* Desktop Header */
        header {
            width: 100%;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.85);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        nav {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .profile-pic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--green);
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.4rem;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span { color: var(--green); }

        .desktop-nav {
            display: flex;
            gap: 16px;
            list-style: none;
        }

        .desktop-nav li a {
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .desktop-nav li a:hover,
        .desktop-nav li a.active {
            color: var(--green);
            background: rgba(63, 169, 169, 0.1);
        }

        .logout-btn {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: var(--red);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 77, 77, 0.25);
            transform: translateY(-2px);
        }

        /* Mobile Top Bar */
        .mobile-top-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .mobile-profile-btn img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--green);
        }

        .mobile-logout-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .mobile-logout-btn img {
            width: 20px;
            height: 20px;
            filter: drop-shadow(0 0 4px rgba(255, 77, 77, 0.5));
        }

        /* Mobile Bottom Navigation */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            z-index: 1000;
        }

        .mobile-bottom-nav a {
            color: #888;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .mobile-bottom-nav a.active { color: var(--green); }

        .nav-icon {
            width: 20px;
            height: 20px;
        }

        /* Alerts Container */
        .notif-container {
            max-width: 680px;
            margin: 110px auto 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .page-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 6px;
        }

        .page-subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .notif-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .notif-tab {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #888;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .notif-tab.active {
            background: rgba(63, 169, 169, 0.15);
            color: var(--green);
            border-color: var(--green);
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .notif-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .notif-card.unread {
            border-left: 4px solid var(--green);
            background: #151515;
        }

        .notif-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #080808;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1.5px solid var(--border);
        }

        .notif-icon-box img {
            width: 100%; 
            height: 100%;
            object-fit: cover;
        }

        .notif-content { flex: 1; }
        .notif-title { color: #fff; font-size: 0.98rem; font-weight: 700; margin: 0 0 3px 0; }
        .notif-desc { color: #aaa; font-size: 0.86rem; margin: 0 0 10px 0; }
        .notif-time { color: var(--orange); font-size: 0.75rem; font-weight: 600; }

        .notif-actions {
            display: flex; 
            gap: 10px; 
            margin-top: 10px;
        }

        .btn-notif {
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .btn-notif:hover { transform: translateY(-1px); }

        .btn-notif-primary { background: var(--green); color: #000; box-shadow: 0 0 15px rgba(63,169,169,0.25); }
        .btn-notif-secondary { background: rgba(255, 255, 255, 0.05); color: #ccc; border: 1px solid var(--border); }

        .empty-notif {
            text-align: center; color: #666; padding: 60px 0; font-size: 0.95rem; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
        }

        @media (max-width: 768px) {
            header { display: none !important; }
            .mobile-top-bar { display: flex; }
            .mobile-bottom-nav { display: flex; }
            .notif-container { margin-top: 80px; }
        }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div id="mouse-glow"></div>

    <!-- Mobile Top Bar -->
    <div class="mobile-top-bar">
        <a href="user.html" class="mobile-profile-btn">
            <img id="mobileTopAvatar" class="profile-pic" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Profile">
        </a>
        <button class="mobile-logout-btn logout-btn" aria-label="Logout" id="mobileLogoutBtn">
            <img src="assets/svg/logout.svg" alt="Logout">
        </button>
    </div>

    <!-- Desktop Header -->
    <header>
        <nav>
            <div class="brand-container">
                <a href="user.html" class="desktop-profile-btn">
                    <img id="desktopTopAvatar" class="profile-pic" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Profile">
                </a>
                <a href="index.html" class="logo">UNDERGROUND <span>CHAT</span></a>
            </div>
            <ul class="desktop-nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="user.html">Chats</a></li>
                <li><a href="friends.html">Friends</a></li>
                <li><a href="notification.html" class="active">Alerts</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
            <div class="header-actions">
                <button class="logout-btn" id="desktopLogoutBtn">DISCONNECT</button>
            </div>
        </nav>
    </header>

    <!-- Alerts Main Container -->
    <main class="notif-container">
        <h1 class="page-title">TUNNEL ALERTS</h1>
        <p class="page-subtitle">Real-time signal feed and incoming network connection requests.</p>

        <div class="notif-tabs">
            <button class="notif-tab active" data-filter="all">All Alerts</button>
            <button class="notif-tab" data-filter="requests">Requests</button>
            <button class="notif-tab" data-filter="messages">Messages</button>
        </div>

        <div class="notif-list" id="notifList">
            <div class="empty-notif">Listening for underground signals...</div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <a href="index.html">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            Home
        </a>
        <a href="user.html">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Chats
        </a>
        <a href="friends.html">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Friends
        </a>
        <a href="notification.html" class="active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            Alerts
        </a>
        <a href="settings.html">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Settings
        </a>
    </div>

    <!-- Firebase SDK & Notifications Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const defaultAvatar = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80";

        const notifList = document.getElementById("notifList");
        const mobileTopAvatar = document.getElementById("mobileTopAvatar");
        const desktopTopAvatar = document.getElementById("desktopTopAvatar");

        let currentUserId = null;
        let activeFilter = "all";

        let friendRequests = [];
        let chatAlerts = [];

        onAuthStateChanged(auth, async (user) => {
            const fallbackId = localStorage.getItem("ug_current_user_id");
            if (!user && !fallbackId) {
                window.location.href = "login.html";
                return;
            }
            currentUserId = user ? user.uid : fallbackId;
            await loadHeaderProfile(currentUserId);
            
            // Request Notification Permission on load
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }

            listenToFriendRequests();
            listenToChatAlerts();
        });

        async function loadHeaderProfile(uid) {
            try {
                const docSnap = await getDoc(doc(db, "users", uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const photo = data.photo || defaultAvatar;
                    if (mobileTopAvatar) mobileTopAvatar.src = photo;
                    if (desktopTopAvatar) desktopTopAvatar.src = photo;
                }
            } catch (err) {
                console.error("Error loading header profile:", err);
            }
        }

        // Browser Notification Push Trigger linked with Settings check
        function triggerPushAlert(title, bodyText) {
            const notificationsEnabled = localStorage.getItem('ug_notifications_enabled') !== 'false';
            if (!notificationsEnabled) return;

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: bodyText,
                    icon: defaultAvatar
                });
            }
        }

        function listenToFriendRequests() {
            const q = query(collection(db, "friendRequests"), where("to", "==", currentUserId));
            
            onSnapshot(q, async (snapshot) => {
                friendRequests = [];
                for (let docSnap of snapshot.docs) {
                    const reqData = docSnap.data();
                    let senderData = {};
                    try {
                        const senderDoc = await getDoc(doc(db, "users", reqData.from));
                        if (senderDoc.exists()) senderData = senderDoc.data();
                    } catch (e) { console.warn("Could not fetch user profile", e); }

                    const senderName = senderData.fullName || senderData.username || "Operator";
                    friendRequests.push({
                        id: docSnap.id,
                        fromUid: reqData.from,
                        type: "request",
                        icon: senderData.photo || defaultAvatar,
                        title: senderName,
                        desc: "sent you a crew connection request.",
                        time: "Pending Request",
                        unread: true
                    });

                    // Trigger alert for new incoming request if added recently
                    if (!docSnap.metadata.fromCache) {
                        triggerPushAlert("New Connection Request", `${senderName} sent you a connection request.`);
                    }
                }
                renderAllNotifications();
            }, (error) => {
                console.error("Friend Request listener error:", error);
            });
        }

        function listenToChatAlerts() {
            const q = query(collection(db, "chats"), where("members", "array-contains", currentUserId));
            
            onSnapshot(q, async (snapshot) => {
                chatAlerts = [];
                for (let docSnap of snapshot.docs) {
                    const data = docSnap.data();
                    if (
                        data.lastSenderId &&
                        data.lastSenderId !== currentUserId &&
                        data.unreadBy &&
                        data.unreadBy.includes(currentUserId)
                    ) {
                        let senderData = {};
                        try {
                            const senderDoc = await getDoc(doc(db, "users", data.lastSenderId));
                            if (senderDoc.exists()) senderData = senderDoc.data();
                        } catch (e) { console.warn("Could not fetch sender info", e); }

                        const senderName = senderData.fullName || senderData.username || 'Crew';
                        const lastMsg = data.lastMessage || 'Sent a message';

                        chatAlerts.push({
                            id: docSnap.id,
                            peerUid: data.lastSenderId,
                            type: "message",
                            icon: senderData.photo || defaultAvatar,
                            title: `New Signal: ${senderName}`,
                            desc: `"${lastMsg}"`,
                            time: "Unread Message",
                            unread: true
                        });

                        if (!docSnap.metadata.fromCache) {
                            triggerPushAlert(`New Signal from ${senderName}`, lastMsg);
                        }
                    }
                }
                renderAllNotifications();
            }, (error) => {
                console.error("Chat Alerts listener error:", error);
            });
        }

        function renderAllNotifications() {
            notifList.innerHTML = "";
            let combined = [...friendRequests, ...chatAlerts];

            if (activeFilter === "requests") combined = combined.filter(n => n.type === "request");
            if (activeFilter === "messages") combined = combined.filter(n => n.type === "message");

            if (combined.length === 0) {
                notifList.innerHTML = `<div class="empty-notif">No active signals found in the tunnel. 🟢</div>`;
                return;
            }

            combined.forEach(notif => {
                const card = document.createElement("div");
                card.className = `notif-card ${notif.unread ? 'unread' : ''}`;

                card.innerHTML = `
                    <div class="notif-icon-box">
                        <img src="${notif.icon}" alt="Avatar">
                    </div>
                    <div class="notif-content">
                        <h3 class="notif-title">${notif.title}</h3>
                        <p class="notif-desc">${notif.desc}</p>
                        <span class="notif-time">${notif.time}</span>
                        ${notif.type === 'request' ? `
                            <div class="notif-actions">
                                <button class="btn-notif btn-notif-primary accept-btn" data-req-id="${notif.id}" data-from="${notif.fromUid}">Accept</button>
                                <button class="btn-notif btn-notif-secondary decline-btn" data-req-id="${notif.id}">Decline</button>
                            </div>
                        ` : `
                            <div class="notif-actions">
                                <a href="chat.html?chatId=${notif.id}&peerUid=${notif.peerUid}" class="btn-notif btn-notif-primary">Open Chat</a>
                            </div>
                        `}
                    </div>
                `;
                notifList.appendChild(card);
            });

            document.querySelectorAll(".accept-btn").forEach(btn => {
                btn.onclick = () => acceptFriendRequest(btn.dataset.reqId, btn.dataset.from);
            });

            document.querySelectorAll(".decline-btn").forEach(btn => {
                btn.onclick = () => declineFriendRequest(btn.dataset.reqId);
            });
        }

        async function acceptFriendRequest(requestId, fromUid) {
            try {
                await setDoc(doc(db, "friends", `${currentUserId}_${fromUid}`), {
                    user1: currentUserId,
                    user2: fromUid,
                    timestamp: Date.now()
                });
                await setDoc(doc(db, "friends", `${fromUid}_${currentUserId}`), {
                    user1: fromUid,
                    user2: currentUserId,
                    timestamp: Date.now()
                });
                await deleteDoc(doc(db, "friendRequests", requestId));
            } catch (err) {
                console.error("Accept error:", err);
            }
        }

        async function declineFriendRequest(requestId) {
            try {
                await deleteDoc(doc(db, "friendRequests", requestId));
            } catch (err) {
                console.error("Decline error:", err);
            }
        }

        document.querySelectorAll(".notif-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".notif-tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                activeFilter = tab.dataset.filter;
                renderAllNotifications();
            });
        });

        // Logout Handlers
        async function handleLogout() {
            try {
                await signOut(auth);
                localStorage.removeItem("ug_current_user_id");
                window.location.href = "login.html";
            } catch (err) {
                console.error("Logout Error:", err);
            }
        }

        document.getElementById('desktopLogoutBtn')?.addEventListener('click', handleLogout);
        document.getElementById('mobileLogoutBtn')?.addEventListener('click', handleLogout);

        // Mouse Glow Tracking
        const glow = document.getElementById('mouse-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
