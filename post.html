<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publish a Book | Urban Noir</title>
  <meta name="theme-color" content="#050505">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <style>
    .post-container {
      max-width: 650px;
      margin: 40px auto;
      padding: 24px;
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .post-header { margin-bottom: 24px; text-align: center; }
    .post-header h1 { font-family: 'Permanent Marker', cursive; font-size: 2rem; color: #FF7A00; }
    .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-weight: 600; font-size: 0.9rem; color: #ccc; }
    .form-group textarea {
      width: 100%; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px; color: #fff; padding: 12px; font-family: 'Outfit', sans-serif; box-sizing: border-box;
    }
    .form-group textarea:focus { outline: none; border-color: #FF7A00; }
    
    /* Input ও Select এর জন্য CSS */
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      background: #0a0a0a;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 8px;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #FF7A00;
    }

    /* File Input Wrapper ও Text Overflow Fix */
    .file-input-wrapper {
      position: relative; background: #0a0a0a; border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s ease;
    }
    .file-input-wrapper span {
      display: block;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .file-input-wrapper:hover { border-color: #FF7A00; background: rgba(255, 122, 0, 0.05); }
    .file-input-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    
    .preview-box { margin-top: 10px; max-height: 200px; display: none; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .btn-submit {
      width: 100%; padding: 14px; background: #FF7A00; color: #000; font-weight: 700;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; text-transform: uppercase;
    }
    .btn-submit:hover { background: #e06c00; }
    .btn-submit:disabled { background: #555; cursor: not-allowed; }
    .status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-weight: 600; font-size: 0.9rem; }
    .status-msg.error { background: rgba(255, 0, 0, 0.2); color: #ff4d4d; border: 1px solid rgba(255, 0, 0, 0.3); }
    .status-msg.success { background: rgba(0, 255, 0, 0.2); color: #00ff66; border: 1px solid rgba(0, 255, 0, 0.3); }
  </style>
</head>
<body>
  <div id="graffiti-bg"></div>
  <div id="mouse-glow"></div>
  <canvas id="particles-canvas"></canvas>

  <header>
    <nav>
      <div class="brand-container">
        <a href="index.html" class="logo">UNDERGROUND <span>CHAT</span></a>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn-secondary" style="padding: 8px 16px; text-decoration: none;">← Back</a>
      </div>
    </nav>
  </header>

  <main class="post-container">
    <div class="post-header">
      <h1>Publish to the Tunnel</h1>
      <p style="color: #888; font-size: 0.9rem;">Share cover art, documents, or texts directly to the network.</p>
    </div>

    <form id="publishForm">
      <div class="form-group">
        <label>Cover Photo (Optional)</label>
        <div class="file-input-wrapper">
          <span id="photoLabelText"> Click or Drag Cover Image Here</span>
          <input type="file" id="photoInput" accept="image/*">
        </div>
        <div class="preview-box" id="photoPreview"><img src="" alt="Preview"></div>
      </div>

      <div class="form-group">
        <label>Book / Document File (Optional)</label>
        <div class="file-input-wrapper">
          <span id="docLabelText">📄 Click or Drag Document / PDF Here</span>
          <input type="file" id="docInput" accept=".pdf,.epub,.txt,.docx">
        </div>
      </div>

      <!-- Author Name -->
      <div class="form-group">
        <label for="authorInput">Author Name</label>
        <input type="text" id="authorInput" placeholder="Author Name">
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="categoryInput">Category</label>
        <select id="categoryInput">
          <option value="">Select Category</option>
          <option>Novel</option>
          <option>Programming</option>
          <option>Science</option>
          <option>Engineering</option>
          <option>History</option>
          <option>Religion</option>
          <option>Others</option>
        </select>
      </div>

      <!-- Tags -->
      <div class="form-group">
        <label for="tagsInput">Tags</label>
        <input type="text" id="tagsInput" placeholder="example: javascript, html, css">
      </div>

      <div class="form-group">
        <label for="captionInput">Book title</label>
        <textarea id="captionInput" rows="4" placeholder="Write something underground..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Publish Now</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const WORKER_URL = "https://urbannoir-api.mushfiquemonowarnamir2006.workers.dev/posts";

    const firebaseConfig = {
      apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
      authDomain: "urbannoir-13ce8.firebaseapp.com",
      projectId: "urbannoir-13ce8",
      storageBucket: "urbannoir-13ce8.firebasestorage.app",
      messagingSenderId: "1059246827383",
      appId: "1:1059246827383:web:caa91c40c408d46e3b6372"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
      }
    });

    const photoInput = document.getElementById("photoInput");
    const docInput = document.getElementById("docInput");
    const photoLabelText = document.getElementById("photoLabelText");
    const docLabelText = document.getElementById("docLabelText");
    const photoPreview = document.getElementById("photoPreview");
    const publishForm = document.getElementById("publishForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        photoLabelText.textContent = `Selected: ${file.name}`;
        const reader = new FileReader();
        reader.onload = (event) => {
          photoPreview.querySelector("img").src = event.target.result;
          photoPreview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });

    docInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const shortName = file.name.length > 35 ? file.name.substring(0, 35) + "..." : file.name;
        docLabelText.textContent = `📄 ${shortName}`;
      }
    });

    publishForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const photoFile = photoInput.files[0];
      const docFile = docInput.files[0];
      const captionText = document.getElementById("captionInput").value.trim();
      
      const author = document.getElementById("authorInput").value.trim();
      const category = document.getElementById("categoryInput").value;
      const tags = document.getElementById("tagsInput").value.trim();

      if (!photoFile && !docFile && !captionText) {
        showStatus("Please attach a photo, document, or enter a caption.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Publishing...";
      showStatus("Uploading to subterranean servers...", "success");

      const formData = new FormData();
      if (photoFile) formData.append("photo", photoFile);
      if (docFile) formData.append("document", docFile);
      if (captionText) formData.append("caption", captionText);
      if (author) formData.append("author", author);
      if (category) formData.append("category", category);
      if (tags) formData.append("tags", tags);
      if (currentUser) formData.append("publisher_uid", currentUser.uid);

      try {
        const response = await fetch(WORKER_URL, { method: "POST", body: formData });
        const data = await response.json();

        if (response.ok && data.success) {
          showStatus("Published successfully! Redirecting...", "success");
          setTimeout(() => { window.location.href = "index.html"; }, 1500);
        } else {
          throw new Error(data.error || "Server response was not OK.");
        }
      } catch (err) {
        console.error("Publish error:", err);
        showStatus("Failed to publish: " + err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Publish Now";
      }
    });

    function showStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`;
      statusMsg.style.display = "block";
    }
  </script>
</body>
</html>
