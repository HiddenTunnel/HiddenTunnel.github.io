<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publish a Book | Urban Noir</title>
  <meta name="theme-color" content="#050505">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Publish Page Styling */
    .publish-container {
      max-width: 650px;
      margin: 100px auto 40px auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .form-card {
      background: var(--card-bg, #0a0a0a);
      border: 1px solid var(--border-color, rgba(255, 255, 255, 0.1));
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    }

    .form-header {
      margin-bottom: 24px;
      border-left: 4px solid var(--green);
      padding-left: 14px;
    }

    .form-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #ccc;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, 
    .form-textarea {
      background: #121212;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-input:focus, 
    .form-textarea:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(92, 255, 114, 0.2);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .toggle-group {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      background: #121212;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .price-input-wrapper {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    /* Pending Screen Notice */
    .pending-box {
      background: rgba(255, 122, 0, 0.08);
      border: 1px solid var(--orange);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .pending-box h2 {
      color: var(--orange);
      font-size: 1.4rem;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .pending-box p {
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .btn-submit {
      width: 100%;
      background: var(--green);
      color: #000;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(92, 255, 114, 0.3);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(92, 255, 114, 0.6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Ambient FX -->
  <div id="graffiti-bg"></div>
  <div id="mouse-glow"></div>

  <!-- Mobile Top Bar -->
  <div class="mobile-top-bar">
    <a href="id.html" class="mobile-profile-btn" title="View Profile">
      <img src="assets/svg/user.svg" alt="Profile ID" id="mobileProfilePic">
    </a>
    <button type="button" class="mobile-logout-btn" id="logoutBtnMobile" title="Logout">
      <img src="assets/svg/logout.svg" alt="Logout">
    </button>
  </div>

  <main class="publish-container">
    <div class="form-card">
      
      <!-- Book Creation Form -->
      <form id="publishForm">
        <div class="form-header">
          <h1>Publish a Book</h1>
        </div>

        <!-- 1. Book Title -->
        <div class="form-group">
          <label for="bookTitle">Book Title</label>
          <input type="text" id="bookTitle" class="form-input" placeholder="Enter book title..." required>
        </div>

        <!-- 2. Cover Picture -->
        <div class="form-group">
          <label for="coverFile">Cover Image File</label>
          <input type="file" id="coverFile" class="form-input" accept="image/*" required>
        </div>

        <!-- 3. Upload File (PDF / EPUB) -->
        <div class="form-group">
          <label for="bookFile">Upload File (PDF / EPUB File)</label>
          <input type="file" id="bookFile" class="form-input" accept=".pdf,.epub" required>
        </div>

        <!-- 4. Description -->
        <div class="form-group">
          <label for="bookDescription">Description</label>
          <textarea id="bookDescription" class="form-textarea" placeholder="Write a short summary or description..." required></textarea>
        </div>

        <!-- 5. Tags -->
        <div class="form-group">
          <label for="bookTags">Tags (Comma Separated)</label>
          <input type="text" id="bookTags" class="form-input" placeholder="cyberpunk, street, fiction">
        </div>

        <!-- 6. Free vs Paid Option -->
        <div class="toggle-group">
          <label class="toggle-item">
            <input type="radio" name="accessType" value="free" id="typeFree" checked>
            <span>Free Download</span>
          </label>
          <label class="toggle-item">
            <input type="radio" name="accessType" value="paid" id="typePaid">
            <span>Paid Book (bKash)</span>
          </label>
        </div>

        <!-- bKash Price Field -->
        <div class="form-group price-input-wrapper" id="priceWrapper">
          <label for="bookPrice">Price (BDT / bKash)</label>
          <input type="number" id="bookPrice" class="form-input" placeholder="Amount in BDT (e.g. 150)">
        </div>

        <!-- Publish Button -->
        <button type="submit" class="btn-submit" id="submitBtn">Publish Book</button>
      </form>

      <!-- Waiting for Permission Notice (Appears After Clicking Publish) -->
      <div id="pendingNotice" class="pending-box">
        <h2>⏳ Waiting for Approval</h2>
        <p>Your book has been submitted! It is currently sitting in the underground queue. You must get permission from the developer to make it public in the library feed.</p>
        <a href="developer.html" class="btn-primary" style="display: inline-block; padding: 12px 28px; text-decoration: none;">Get Permission from Developer</a>
      </div>

    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
      authDomain: "urbannoir-13ce8.firebaseapp.com",
      projectId: "urbannoir-13ce8",
      storageBucket: "urbannoir-13ce8.firebasestorage.app",
      messagingSenderId: "1059246827383",
      appId: "1:1059246827383:web:caa91c40c408d46e3b6372"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    // Price Field Toggle Logic
    const typeFree = document.getElementById('typeFree');
    const typePaid = document.getElementById('typePaid');
    const priceWrapper = document.getElementById('priceWrapper');

    typeFree.addEventListener('change', () => priceWrapper.style.display = 'none');
    typePaid.addEventListener('change', () => priceWrapper.style.display = 'flex');

    // Auth Protection
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
    });

    // Submission Handler
    document.getElementById('publishForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      const isPaid = typePaid.checked;
      const title = document.getElementById('bookTitle').value;
      const coverFile = document.getElementById('coverFile').files[0];
      const bookFile = document.getElementById('bookFile').files[0];
      const description = document.getElementById('bookDescription').value;
      const price = isPaid ? parseFloat(document.getElementById('bookPrice').value) || 0 : 0;
      const tags = document.getElementById('bookTags').value.split(',').map(t => t.trim()).filter(Boolean);

      try {
        // Store in Firebase with status: "pending"
        await addDoc(collection(db, "books"), {
          title: title,
          description: description,
          tags: tags,
          downloads: 0,
          likes: 0,
          uploader: currentUser.displayName || currentUser.email || "Underground Author",
          uploaderId: currentUser.uid,
          paid: isPaid,
          price: price,
          status: "pending", // Pending developer approval
          createdAt: serverTimestamp()
        });

        // Hide form and show "Wait for Developer Permission" UI
        document.getElementById('publishForm').style.display = 'none';
        document.getElementById('pendingNotice').style.display = 'block';

      } catch (err) {
        console.error("Failed to submit book:", err);
        alert("Submission failed. Please try again.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish Book";
      }
    });
  </script>
</body>
</html>
