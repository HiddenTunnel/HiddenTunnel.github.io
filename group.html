<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground Group Chat</title>
    <meta name="theme-color" content="#111111">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --green: #5CFF72;
            --orange: #FF7A00;
            --bg: #050505;
            --card-bg: #141414;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Hide top navigation on Chat Page */
        header, nav, .top-nav, #navbar-container > header, .bottom-nav {
            display: none !important;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #152517 0%, #050505 70%);
        }

        /* Main Fixed Chat Container */
        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 100dvh;
            margin: 0 auto;
            background: #111;
            border: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
        }

        /* Header Layout */
        .chat-header {
            height: 60px;
            flex-shrink: 0;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 20;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .group-info-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--green);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .peer-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--green);
        }

        .peer-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .peer-info p {
            font-size: 0.75rem;
            color: #888;
        }

        /* Message Scroll Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Fixed Android Mobile Inline Flex Message Bubble */
        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.sent {
            align-self: flex-end;
            margin-left: auto;
            background: var(--green);
            color: #000;
            border-bottom-right-radius: 2px;
            font-weight: 500;
        }

        .message-bubble.received {
            align-self: flex-start;
            margin-right: auto;
            background: #222;
            color: #fff;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sender-name {
            display: block;
            font-size: 0.68rem;
            margin-bottom: 2px;
            color: var(--green);
            font-weight: 600;
        }

        .msg-time {
            font-size: 0.65rem;
            display: block;
            margin-top: 5px;
            opacity: 0.7;
            align-self: flex-end;
        }

        /* Input Area Wrapper */
        .chat-input-wrapper {
            flex-shrink: 0;
            padding: 12px 16px;
            background: #151515;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-form input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid rgba(92, 255, 114, 0.2);
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input-form input:focus {
            border-color: var(--green);
        }

        .send-btn {
            background: var(--green);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: #000;
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: #1e1e1e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 6px 0;
            z-index: 100;
            display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .context-menu button {
            width: 100%;
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu button:hover {
            background: rgba(92, 255, 114, 0.15);
            color: var(--green);
        }

        .context-menu button.delete-btn {
            color: #ff4d4d;
        }

        /* Mobile Viewport */
        @media (max-width: 768px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }

            .chat-container {
                height: 100dvh;
                width: 100%;
                border-radius: 0;
                margin: 0;
            }

            .chat-header {
                height: 60px;
                flex-shrink: 0;
            }

            .chat-messages {
                flex: 1;
                overflow-y: auto;
                padding-bottom: 10px;
            }

            .chat-input-wrapper {
                flex-shrink: 0;
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Group Header -->
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" id="backBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div class="group-info-wrap" id="groupInfoWrap">
                    <img id="groupAvatar" class="peer-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z'/></svg>" alt="Group Avatar">
                    <div class="peer-info">
                        <h3 id="groupName">Loading Crew...</h3>
                        <p id="groupMembersCount">...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Dynamic Messages -->
        </div>

        <!-- Chat Input Form -->
        <div class="chat-input-wrapper">
            <form class="chat-input-form" id="chatForm">
                <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off" required>
                <button type="submit" class="send-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <button id="copyMsgBtn">📋 Copy Text</button>
        <button id="deleteMsgBtn" class="delete-btn" style="display: none;">🗑️ Delete Message</button>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
            serverTimestamp, doc, getDoc, getDocs, updateDoc, deleteDoc, limit,
            arrayRemove, arrayUnion 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Notification Sound Setup
        const messageSound = new Audio("assets/sounds/notification.mp3");
        messageSound.preload = "auto";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const groupId = new URLSearchParams(window.location.search).get('groupId');

        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const groupName = document.getElementById('groupName');
        const groupMembersCount = document.getElementById('groupMembersCount');
        const groupAvatar = document.getElementById('groupAvatar');
        const backBtn = document.getElementById('backBtn');
        const contextMenu = document.getElementById('contextMenu');
        const copyMsgBtn = document.getElementById('copyMsgBtn');
        const deleteMsgBtn = document.getElementById('deleteMsgBtn');

        let currentUserId = null;
        let currentUserName = "Member";
        let selectedMsgData = null;
        let pressTimer = null;

        backBtn.onclick = () => window.location.href = "user.html";

        document.getElementById("groupInfoWrap").addEventListener("click", () => {
            console.log("clicked header for groupId:", groupId);
            if (groupId) {
                window.location.href = "chat-setting.html?groupId=" + groupId;
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                if (!groupId) {
                    alert("Invalid Group Session");
                    window.location.href = "user.html";
                    return;
                }
                
                await loadCurrentUserInfo();
                const isMember = await verifyGroupMembership();
                
                if (isMember) {
                    listenGroupMessages();
                } else {
                    alert("Access Denied: You are not a member of this group.");
                    window.location.href = "user.html";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        async function verifyGroupMembership() {
            try {
                const groupSnap = await getDoc(doc(db, "groups", groupId));
                if (groupSnap.exists()) {
                    const data = groupSnap.data();
                    const members = data.members || [];
                    
                    if (!members.includes(currentUserId)) {
                        return false;
                    }

                    groupName.textContent = data.groupName || "Group Chat";
                    groupMembersCount.textContent = `${members.length} Members`;
                    if (data.groupPhoto) groupAvatar.src = data.groupPhoto;
                    
                    return true;
                }
            } catch (err) {
                console.error("Membership check error:", err);
            }
            return false;
        }

        async function loadCurrentUserInfo() {
            try {
                const userSnap = await getDoc(doc(db, "users", currentUserId));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    currentUserName = data.fullName || data.name || "Member";
                }
            } catch (err) {
                console.error("User fetch error:", err);
            }
        }

        async function listenGroupMessages() {
            // Clear unread status for current user when opening group chat
            try {
                await updateDoc(doc(db, "groups", groupId), {
                    unreadBy: arrayRemove(currentUserId)
                });
            } catch (err) {
                console.warn("Could not clear unreadBy status:", err);
            }

            const msgsRef = collection(db, "groups", groupId, "messages");
            const q = query(msgsRef, orderBy("timestamp", "asc"));

            let firstLoad = true;

            onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = "";
                snapshot.docs.forEach((docSnap) => {
                    const msg = docSnap.data();
                    renderMessage(docSnap.id, msg);

                    if (!firstLoad && msg.senderId !== currentUserId) {
                        messageSound.currentTime = 0;
                        messageSound.play().catch(() => {});
                    }
                });

                firstLoad = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function renderMessage(msgId, msg) {
            const bubble = document.createElement("div");
            const isSent = msg.senderId === currentUserId;
            
            bubble.className = `message-bubble ${isSent ? 'sent' : 'received'}`;

            const timeStr = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';

            bubble.innerHTML = `
                ${!isSent ? `<span class="sender-name">${escapeHTML(msg.senderName || 'Member')}</span>` : ''}
                ${escapeHTML(msg.text)}
                <span class="msg-time">${timeStr}</span>
            `;

            // Menu Handlers
            const openMenu = (e) => {
                e.preventDefault();
                selectedMsgData = { id: msgId, text: msg.text, senderId: msg.senderId };
                deleteMsgBtn.style.display = (msg.senderId === currentUserId) ? "block" : "none";
                
                const x = e.clientX || (e.touches ? e.touches[0].clientX : 100);
                const y = e.clientY || (e.touches ? e.touches[0].clientY : 100);
                
                contextMenu.style.left = `${Math.min(x, window.innerWidth - 160)}px`;
                contextMenu.style.top = `${Math.min(y, window.innerHeight - 100)}px`;
                contextMenu.style.display = "block";
            };

            const cancelTimer = () => clearTimeout(pressTimer);

            bubble.addEventListener('contextmenu', openMenu);
            bubble.addEventListener('touchstart', (e) => {
                pressTimer = setTimeout(() => openMenu(e), 500);
            });
            bubble.addEventListener('touchend', cancelTimer);
            bubble.addEventListener('touchmove', cancelTimer);
            bubble.addEventListener('touchcancel', cancelTimer);

            chatMessages.appendChild(bubble);
        }

        document.addEventListener('click', () => contextMenu.style.display = "none");

        copyMsgBtn.onclick = async () => {
            if (!selectedMsgData) return;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(selectedMsgData.text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = selectedMsgData.text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                }
            } catch (err) {
                alert("Could not copy message.");
            }
        };

        deleteMsgBtn.onclick = async () => {
            if (selectedMsgData && selectedMsgData.senderId === currentUserId) {
                try {
                    await deleteDoc(doc(db, "groups", groupId, "messages", selectedMsgData.id));
                    
                    const msgsRef = collection(db, "groups", groupId, "messages");
                    const q = query(msgsRef, orderBy("timestamp", "desc"), limit(1));
                    const lastSnap = await getDocs(q);

                    let newLastMsg = "Group created";
                    if (!lastSnap.empty) {
                        const lastData = lastSnap.docs[0].data();
                        newLastMsg = `${lastData.senderName || 'Member'}: ${lastData.text}`;
                    }

                    await updateDoc(doc(db, "groups", groupId), {
                        lastMessage: newLastMsg,
                        updatedAt: serverTimestamp()
                    });
                } catch (err) {
                    console.error("Delete failed:", err);
                }
            }
        };

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUserId) return;

            messageInput.value = "";

            try {
                // Add message to subcollection
                await addDoc(collection(db, "groups", groupId, "messages"), {
                    senderId: currentUserId,
                    senderName: currentUserName,
                    text: text,
                    timestamp: serverTimestamp()
                });

                // Get members to set unread for everyone except current user
                const groupSnap = await getDoc(doc(db, "groups", groupId));
                let otherMembers = [];
                if (groupSnap.exists()) {
                    const members = groupSnap.data().members || [];
                    otherMembers = members.filter(uid => uid !== currentUserId);
                }

                await updateDoc(doc(db, "groups", groupId), {
                    lastMessage: `${currentUserName}: ${text}`,
                    lastSenderId: currentUserId,
                    unreadBy: otherMembers,
                    updatedAt: serverTimestamp()
                });

            } catch (err) {
                console.error("Failed to send message:", err);
            }
        });

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&#34;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
