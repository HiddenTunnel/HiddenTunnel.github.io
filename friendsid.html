<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Chat - Friend ID Card</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --green: #5CFF72;
            --orange: #FF7A00;
            --bg: #050505;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0; padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 450px; height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 255, 114, 0.12) 0%, rgba(255, 122, 0, 0.05) 45%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        .id-wrapper {
            max-width: 440px;
            margin: 110px auto 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .id-card {
            background: linear-gradient(145deg, #181818 0%, #0d0d0d 100%);
            border: 2px solid rgba(92, 255, 114, 0.4);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(92, 255, 114, 0.15);
            position: relative;
            overflow: hidden;
        }

        .id-card::before {
            content: "OFFICIAL TAGGER";
            position: absolute;
            top: 18px;
            right: -30px;
            background: var(--orange, #FF7A00);
            color: #000;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 4px 35px;
            transform: rotate(45deg);
            letter-spacing: 1px;
        }

        .id-header {
            text-align: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            padding-bottom: 16px;
            margin-bottom: 22px;
        }

        .id-header h2 {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 1px;
            margin: 0;
        }

        .id-header h2 span {
            color: var(--green, #5CFF72);
        }

        .id-header p {
            font-size: 0.75rem;
            color: var(--orange, #FF7A00);
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 700;
        }

        .id-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .id-photo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--green, #5CFF72);
            padding: 3px;
            background: #000;
            box-shadow: 0 0 20px rgba(92, 255, 114, 0.3);
            overflow: hidden;
        }

        .id-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .id-details {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 8px;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: #888;
            font-weight: 500;
            font-size: 0.82rem;
            flex-shrink: 0;
        }

        .detail-value {
            color: #fff;
            font-weight: 700;
            flex: 1;
            min-width: 0;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-value.highlight {
            color: var(--green, #5CFF72);
            font-family: monospace;
            font-size: 1rem;
        }

        .card-actions {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-chat {
            background: var(--green, #5CFF72);
            color: #000;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-edit.requested {
            background: rgba(255, 122, 0, 0.15);
            color: var(--orange);
            border-color: var(--orange);
        }

        .btn-edit.friends {
            background: rgba(92, 255, 114, 0.15);
            color: var(--green);
            border-color: var(--green);
        }

        .btn-action:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>
    <div id="navbar-container"></div>

    <main class="id-wrapper">
        <div class="id-card" id="profileCard">
            <p style="color:#888; text-align:center;">Fetching target signal...</p>
        </div>
    </main>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='8' r='4' fill='%235CFF72'/><path d='M4 20c0-4 3.5-7 8-7s8 3 8 7' fill='%235CFF72'/></svg>";

        const urlParams = new URLSearchParams(window.location.search);
        const targetUid = urlParams.get('uid');
        const profileCard = document.getElementById('profileCard');
        let currentUserId = localStorage.getItem("ug_current_user_id");

        onAuthStateChanged(auth, async (user) => {
            if (user) currentUserId = user.uid;
            if (!targetUid) {
                profileCard.innerHTML = `<p style="color:#ff4d4d; text-align:center;">No target user ID provided.</p>`;
                return;
            }
            await fetchUserProfile();
        });

        // Helper function to mask email address for privacy
        function maskEmail(email) {
            if (!email || !email.includes('@')) return email || 'N/A';
            const [name, domain] = email.split('@');
            if (name.length <= 3) return `${name.charAt(0)}***@${domain}`;
            return `${name.substring(0, 3)}*****@${domain}`;
        }

        async function fetchUserProfile() {
            try {
                const snap = await getDoc(doc(db, "users", targetUid));
                if (!snap.exists()) {
                    profileCard.innerHTML = `<p style="color:#ff4d4d; text-align:center;">User profile does not exist.</p>`;
                    return;
                }

                const u = snap.data();
                const chatId = currentUserId < targetUid ? `${currentUserId}_${targetUid}` : `${targetUid}_${currentUserId}`;
                const maskedEmail = maskEmail(u.email);
                const userBio = u.bio || u.status || "Underground Operator";

                profileCard.innerHTML = `
                    <div class="id-header">
                        <h2>UNDERGROUND <span>ID</span></h2>
                        <p>VERSITY PASSPORT</p>
                    </div>

                    <div class="id-body">
                        <div class="id-photo-container">
                            <img id="displayPhoto" class="id-photo" src="${u.photo || u.avatar || defaultAvatar}" alt="Profile">
                        </div>

                        <div class="id-details">
                            <div class="detail-row">
                                <span class="detail-label">Full Name</span>
                                <span class="detail-value" id="displayName">${u.fullName || u.name || 'Anonymous'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Versity ID</span>
                                <span class="detail-value highlight" id="displayVersityId">${u.versityId || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Email</span>
                                <span class="detail-value" id="displayEmail">${maskedEmail}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Status</span>
                                <span class="detail-value" id="displayStatus">${userBio}</span>
                            </div>
                        </div>
                    </div>

                    ${currentUserId !== targetUid ? `
                        <div class="card-actions">
                            <a href="chat.html?chatId=${chatId}&peerUid=${targetUid}" class="btn-action btn-chat">
                                Chat
                            </a>
                            <button id="friendBtn" class="btn-action btn-edit">
                                Add Friend
                            </button>
                        </div>
                    ` : `<p style="color:#888; text-align:center; margin-top:20px; font-size:0.85rem;">This is your card.</p>`}
                `;

                if (currentUserId && currentUserId !== targetUid) {
                    setupFriendButton();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function setupFriendButton() {
            const friendBtn = document.getElementById('friendBtn');
            if (!friendBtn) return;

            const requestRef = doc(db, "friendRequests", `${currentUserId}_${targetUid}`);
            const friendRef = doc(db, "friends", `${currentUserId}_${targetUid}`);

            onSnapshot(requestRef, (reqSnap) => {
                if (reqSnap.exists()) {
                    friendBtn.textContent = "⏳ Request Sent";
                    friendBtn.className = "btn-action btn-edit requested";
                    friendBtn.onclick = () => deleteDoc(requestRef);
                } else {
                    getDoc(friendRef).then((fSnap) => {
                        if (fSnap.exists()) {
                            friendBtn.textContent = "✔ Friend";
                            friendBtn.className = "btn-action btn-edit friends";
                            friendBtn.onclick = null;
                        } else {
                            friendBtn.textContent = "Add Friend";
                            friendBtn.className = "btn-action btn-edit";
                            friendBtn.onclick = () => setDoc(requestRef, { from: currentUserId, to: targetUid, timestamp: Date.now() });
                        }
                    });
                }
            });
        }

        // Mouse glow tracking effect
        const glow = document.getElementById('mouse-glow');
        if (glow) {
            window.addEventListener('mousemove', (e) => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            });
        }
    </script>

    <!-- Navigation Injector -->
    <script src="navbar.js"></script>
</body>
</html>
