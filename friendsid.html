<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Chat - Profile Card</title>
    <meta name="theme-color" content="#050505">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --green: #5CFF72;
            --orange: #FF7A00;
            --bg: #050505;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0; padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        #mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 450px; height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(92, 255, 114, 0.12) 0%, rgba(255, 122, 0, 0.05) 45%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 18px 32px;
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 1.3rem;
            color: #fff;
            text-decoration: none;
        }

        .logo span { color: var(--green); }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: #b0b0b0;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .profile-container {
            position: relative;
            z-index: 5;
            max-width: 500px;
            margin: 110px auto 60px auto;
            padding: 0 20px;
        }

        .id-card {
            background: #111111;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
        }

        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--green);
        }

        .user-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-tag {
            color: var(--orange);
            font-family: monospace;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .info-grid {
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-item:last-child { margin-bottom: 0; }
        .info-label { color: #888; }
        .info-value { color: #ddd; }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-chat {
            background: var(--green);
            color: #050505;
        }

        .btn-friend {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-friend.requested {
            background: rgba(255, 122, 0, 0.15);
            color: var(--orange);
            border-color: var(--orange);
        }

        .btn-friend.friends {
            background: rgba(92, 255, 114, 0.15);
            color: var(--green);
            border-color: var(--green);
        }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <header>
        <nav>
            <a href="index.html" class="logo">UNDERGROUND <span>CHAT</span></a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="user.html">Chats</a></li>
                <li><a href="notification.html">Alerts</a></li>
            </ul>
        </nav>
    </header>

    <main class="profile-container">
        <div class="id-card" id="profileCard">
            <p style="color:#888;">Fetching target signal...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
            authDomain: "urbannoir-13ce8.firebaseapp.com",
            projectId: "urbannoir-13ce8",
            storageBucket: "urbannoir-13ce8.firebasestorage.app",
            messagingSenderId: "1059246827383",
            appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
            measurementId: "G-CEPWKZXQVF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235CFF72'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        const urlParams = new URLSearchParams(window.location.search);
        const targetUid = urlParams.get('uid');
        const profileCard = document.getElementById('profileCard');
        let currentUserId = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) currentUserId = user.uid;
            if (!targetUid) {
                profileCard.innerHTML = `<p style="color:#ff4d4d;">No target user ID provided.</p>`;
                return;
            }
            await fetchUserProfile();
        });

        async function fetchUserProfile() {
            try {
                const snap = await getDoc(doc(db, "users", targetUid));
                if (!snap.exists()) {
                    profileCard.innerHTML = `<p style="color:#ff4d4d;">User profile does not exist.</p>`;
                    return;
                }

                const u = snap.data();
                const chatId = currentUserId < targetUid ? `${currentUserId}_${targetUid}` : `${targetUid}_${currentUserId}`;

                profileCard.innerHTML = `
                    <div class="avatar-wrapper">
                        <img src="${u.photo || u.avatar || defaultAvatar}" class="profile-avatar" alt="Avatar">
                    </div>
                    <h2 class="user-name">${u.fullName || u.name || 'Anonymous'}</h2>
                    <div class="user-tag">ID: ${u.versityId || targetUid.slice(0, 8)}</div>

                    <div class="info-grid">
                        <div class="info-item"><span class="info-label">Email</span><span class="info-value">${u.email || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Status</span><span class="info-value">${u.bio || 'Underground Operator'}</span></div>
                    </div>

                    ${currentUserId !== targetUid ? `
                        <div class="action-buttons">
                            <a href="chat.html?chatId=${chatId}&peerUid=${targetUid}" class="btn btn-chat">💬 Chat</a>
                            <button id="friendBtn" class="btn btn-friend">➕ Connect</button>
                        </div>
                    ` : `<p style="color:#666;">This is your card.</p>`}
                `;

                if (currentUserId && currentUserId !== targetUid) {
                    setupFriendButton();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function setupFriendButton() {
            const friendBtn = document.getElementById('friendBtn');
            const requestRef = doc(db, "friendRequests", `${currentUserId}_${targetUid}`);
            const friendRef = doc(db, "friends", `${currentUserId}_${targetUid}`);

            onSnapshot(requestRef, (reqSnap) => {
                if (reqSnap.exists()) {
                    friendBtn.textContent = "⏳ Signal Sent";
                    friendBtn.className = "btn btn-friend requested";
                    friendBtn.onclick = () => deleteDoc(requestRef);
                } else {
                    getDoc(friendRef).then((fSnap) => {
                        if (fSnap.exists()) {
                            friendBtn.textContent = "✔ Crew Member";
                            friendBtn.className = "btn btn-friend friends";
                            friendBtn.onclick = null;
                        } else {
                            friendBtn.textContent = "➕ Add Crew";
                            friendBtn.className = "btn btn-friend";
                            friendBtn.onclick = () => setDoc(requestRef, { from: currentUserId, to: targetUid, timestamp: Date.now() });
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
