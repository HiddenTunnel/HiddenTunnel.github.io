<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBAN Noir - Login</title>
  <meta name="theme-color" content="#000000">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Real Concrete Background Layer -->
  <div class="concrete-bg">
<img src ="assets/svg/graffiti-wall.svg"
> </div>
  <!-- Real Graffiti Wall SVG Layer -->
  <img src="assets/svg/graffiti-wall.svg" class="graffiti-bg" alt="Graffiti Art">

  <!-- Login Modal Box -->
  <div class="login-card">
    <a href="index.html" class="brand-logo">
      URBAN <span>Noir</span>
    </a>
    <p class="subtitle">Enter your ID credentials to unlock the tunnel</p>

    <div class="divider">
      <span>OR DIRECT</span>
    </div>

    <button id="googleLoginBtn" class="btn-submit">
      Continue with Google
    </button>

    <div class="register-prompt">
      Don't have a tag yet? <a href="createaccount.html">Create Account</a>
    </div>
  </div>

  <!-- External Authentication Script -->
  <script type="module" src="login.js"></script>

</body>
</html>
