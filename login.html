<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underground Chat - Login</title>
  <meta name="theme-color" content="#050505">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #5CFF72;
      --orange: #FF7A00;
      --bg: #050505;
      --card-bg: rgba(18, 18, 18, 0.85);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient FX */
    #mouse-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(92, 255, 114, 0.12) 0%, rgba(255, 122, 0, 0.05) 45%, transparent 70%);
      pointer-events: none;
      z-index: 2;
      transform: translate(-50%, -50%);
      transition: transform 0.03s linear;
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Modal / Card */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(92, 255, 114, 0.08);
      text-align: center;
      animation: popup 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popup {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .brand-logo {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.8rem;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 8px;
    }

    .brand-logo span {
      color: var(--green);
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #050505;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 0 20px rgba(92, 255, 114, 0.3);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(92, 255, 114, 0.6);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #555;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider span {
      padding: 0 12px;
    }

    .register-prompt {
      margin-top: 24px;
      font-size: 0.88rem;
      color: #888;
    }

    .register-prompt a {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }

    .register-prompt a:hover {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Ambient FX -->
  <div id="mouse-glow"></div>
  <canvas id="particles-canvas"></canvas>

  <!-- Login Modal Box -->
  <div class="login-card">
    <a href="index.html" class="brand-logo">
      UNDERGROUND <span>CHAT</span>
    </a>
    <p class="subtitle">Enter your ID credentials to unlock the tunnel</p>

    <div class="divider">
      <span>OR DIRECT</span>
    </div>

    <button id="googleLoginBtn" class="btn-submit">
      Continue with Google
    </button>

    <div class="register-prompt">
      Don't have a tag yet? <a href="createaccount.html">Create Account</a>
    </div>
  </div>

  <!-- Interactive Visual Scripts -->
  <script>
    // Mouse Glow Track
    const glow = document.getElementById('mouse-glow');
    window.addEventListener('mousemove', (e) => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });

    // Background Particle Canvas
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5 - 0.2;
        this.opacity = Math.random() * 0.6 + 0.2;
        this.color = Math.random() > 0.5 ? '#5CFF72' : '#FF7A00';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>

  <!-- Firebase Auth & Persistence Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        setPersistence,
        browserLocalPersistence,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyARFZiBsFAtgKAtWtMnyka52PORQFolijI",
        authDomain: "urbannoir-13ce8.firebaseapp.com",
        projectId: "urbannoir-13ce8",
        storageBucket: "urbannoir-13ce8.firebasestorage.app",
        messagingSenderId: "1059246827383",
        appId: "1:1059246827383:web:caa91c40c408d46e3b6372",
        measurementId: "G-CEPWKZXQVF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // 1️⃣ AUTO-REMEMBER: অটোমেটিক চেক করবে ব্রাউজারে আগে থেকেই লগইন সেভ আছে কিনা
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            localStorage.setItem("ug_current_user_id", user.uid);
            
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists()) {
                window.location.href = "index.html";
            }
        }
    });

    const googleLoginBtn = document.getElementById("googleLoginBtn");

    // 2️⃣ GOOGLE LOGIN WITH PERSISTENCE
    googleLoginBtn.addEventListener("click", async () => {
        try {
            // ব্রাউজার বন্ধ করলেও যাতে সেশন ধরে রাখে
            await setPersistence(auth, browserLocalPersistence);
            
            const result = await signInWithPopup(auth, provider);
            const user = result.user;

            localStorage.setItem("ug_current_user_id", user.uid);

            const snap = await getDoc(doc(db, "users", user.uid));

            if (snap.exists()) {
                window.location.href = "index.html";
            } else {
                window.location.href = "createaccount.html";
            }

        } catch (error) {
            console.error("Login Error:", error);
            alert(error.message);
        }
    });
  </script>

</body>
</html>
